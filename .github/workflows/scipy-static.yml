name: Experimental SciPy static pack

on:
  pull_request:
    paths:
      - ".github/workflows/scipy-static.yml"
      - "Lib/numpy/**"
      - "Lib/pybind11/**"
      - "Lib/scipy/**"
      - "assets/overlay/Include/staticpython_pack.h"
      - "assets/overlay/Python/staticpython_pack_runtime.c"
      - "build.py"
      - "config.json"
      - "libs.py"
      - "scripts/scipy_profile_verify.py"
      - "scripts/test_runtime_sdk.py"
      - "scripts/test_scipy_pack.py"
      - "scripts/verify_pack_with_runtime_sdk.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staticpython-scipy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  STATICPYTHON_BUILD_WORKERS: "2"

jobs:
  runtime-sdk:
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpython_version: "3.11.15"
            python_tag: cp311
          - cpython_version: "3.12.13"
            python_tag: cp312
          - cpython_version: "3.13.15"
            python_tag: cp313
          - cpython_version: "3.14.7"
            python_tag: cp314
          - cpython_version: "3.15.0rc1"
            python_tag: cp315
    env:
      VERIFY_CPYTHON_VERSION: ${{ matrix.cpython_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime build dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install packaging
          choco install strawberryperl -y --no-progress

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Run runtime SDK contract tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python .\scripts\test_runtime_sdk.py

      - name: Build exact-commit audited runtime SDK
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "scipy-runtime-${{ matrix.python_tag }}"
          $runtimeDist = Join-Path $env:GITHUB_WORKSPACE "dist\runtime"
          New-Item -ItemType Directory -Force $runtimeDist | Out-Null
          python .\build.py `
            --cpython-version $env:VERIFY_CPYTHON_VERSION `
            --download-root $runtimeRoot `
            --profile runtime-sdk `
            --build-workers $env:STATICPYTHON_BUILD_WORKERS `
            --output-runtime-sdk-dir $runtimeDist

      - name: Upload exact runtime SDK
        uses: actions/upload-artifact@v4
        with:
          name: scipy-runtime-sdk-${{ matrix.python_tag }}
          path: dist/runtime/*.zip
          if-no-files-found: error
          retention-days: 7

  sdk-linked-scipy:
    needs: runtime-sdk
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpython_version: "3.11.15"
            python_tag: cp311
          - cpython_version: "3.12.13"
            python_tag: cp312
          - cpython_version: "3.13.15"
            python_tag: cp313
          - cpython_version: "3.14.7"
            python_tag: cp314
          - cpython_version: "3.15.0rc1"
            python_tag: cp315
    env:
      VERIFY_CPYTHON_VERSION: ${{ matrix.cpython_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pack build dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install packaging

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Run SciPy pack contract tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python .\scripts\test_scipy_pack.py

      - uses: actions/download-artifact@v4
        with:
          name: scipy-runtime-sdk-${{ matrix.python_tag }}
          path: dist/runtime

      - name: Build dependency-complete SciPy packs and run behavior smokes
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $runtimeSdk = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\dist\runtime" -Filter *.zip -File)
          if ($runtimeSdk.Count -ne 1) {
            throw "Expected exactly one runtime SDK archive, found $($runtimeSdk.Count)"
          }
          $packRoot = Join-Path $env:RUNNER_TEMP "scipy-pack-1.17.1"
          $resultRoot = Join-Path $env:GITHUB_WORKSPACE "dist\scipy-1.17.1"
          $packDist = Join-Path $resultRoot "packs"
          New-Item -ItemType Directory -Force $packDist | Out-Null
          python .\build.py `
            --cpython-version $env:VERIFY_CPYTHON_VERSION `
            --download-root $packRoot `
            --config .\config.json `
            --profile scipy-experimental `
            --pack-only `
            --pack-runtime-sdk $runtimeSdk[0].FullName `
            --build-workers $env:STATICPYTHON_BUILD_WORKERS `
            --output-pack-dir $packDist
          $sourceRoot = Join-Path $packRoot "cpython-$env:VERIFY_CPYTHON_VERSION"
          Copy-Item `
            -LiteralPath "$sourceRoot\PCbuild\staticpython-pack-verify-report.json" `
            -Destination "$resultRoot\staticpython-pack-verify-report.json"
          Copy-Item `
            -LiteralPath "$sourceRoot\PCbuild\staticpython-pack-verify\staticpython-pack-verify.exe" `
            -Destination "$resultRoot\staticpython-pack-verify.exe"
          Copy-Item `
            -LiteralPath "$sourceRoot\PCbuild\staticpython-pack-verify\staticpython-pack-verify.map" `
            -Destination "$resultRoot\staticpython-pack-verify.map"
          Copy-Item `
            -LiteralPath "$sourceRoot\PCbuild\staticpython-pack-verify\staticpython-pack-verify.pdb" `
            -Destination "$resultRoot\staticpython-pack-verify.pdb"

      - name: Audit SciPy packs, no-extraction, and PE contracts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $resultRoot = Join-Path $env:GITHUB_WORKSPACE "dist\scipy-1.17.1"
          $packs = @(Get-ChildItem -LiteralPath "$resultRoot\packs" -Filter *.zip -File)
          if ($packs.Count -ne 3) { throw "Expected three dependency-complete SciPy packs, found $($packs.Count)" }

          $metadataByName = @{}
          foreach ($pack in $packs) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($pack.FullName)
            try {
              $names = @($archive.Entries | ForEach-Object FullName)
              $forbidden = @($names | Where-Object { [IO.Path]::GetExtension($_) -in @('.dll', '.pyd', '.exe') })
              if ($forbidden.Count -gt 0) { throw "$($pack.Name) contains dynamic/executable files: $($forbidden -join ', ')" }
              $entry = $archive.GetEntry("pack.json")
              if (-not $entry) { throw "$($pack.Name) has no pack.json" }
              $reader = [IO.StreamReader]::new($entry.Open())
              try { $metadata = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            } finally {
              $archive.Dispose()
            }
            if ($metadataByName.ContainsKey($metadata.name)) { throw "Duplicate pack identity $($metadata.name)" }
            if ($metadata.verification.status -ne 'passed') { throw "$($metadata.name) was not verified" }
            if ($metadata.license.status -ne 'complete') { throw "$($metadata.name) has incomplete license evidence" }
            $metadataByName[$metadata.name] = $metadata
          }

          $expected = [ordered]@{
            numpy = @('2.4.4', '2d390634c5182175533585cc89f3608a4682ccb173cc9bb940b2881c8d6f8fa0')
            pybind11 = @('3.0.4', '3286b59c8a774b9ee650169302dd5a4eedc30a8617905a0560dd8ee44775130c')
            scipy = @('1.17.1', '95d8e012d8cb8816c226aef832200b1d45109ed4464303e997c5b13122b297c0')
          }
          foreach ($name in $expected.Keys) {
            if (-not $metadataByName.ContainsKey($name)) { throw "Missing dependency pack $name" }
            $metadata = $metadataByName[$name]
            if ($metadata.version -ne $expected[$name][0]) { throw "Unexpected $name version $($metadata.version)" }
            if ($metadata.source_archive_sha256 -ne $expected[$name][1]) { throw "$name source archive hash is not pinned" }
          }

          $scipy = $metadataByName['scipy']
          if ((@($scipy.dependencies) -join ',') -ne 'numpy,pybind11') {
            throw "SciPy pack does not declare its exact dependency closure"
          }
          if ($scipy.license.expression -ne 'BSD-3-Clause AND MIT') {
            throw "SciPy pack has the wrong license expression"
          }
          foreach ($library in @(
            'scipy._lib._ccallback_c.lib',
            'scipy._lib._uarray._uarray.lib',
            'scipy.fft._pocketfft.pypocketfft.lib'
          )) {
            if ($library -notin @($scipy.libraries)) { throw "SciPy pack is missing $library" }
          }

          $reportPath = Join-Path $resultRoot "staticpython-pack-verify-report.json"
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.status -ne 'passed' -or $report.pe_audit.status -ne 'passed') {
            throw "SDK-linked SciPy behavior or PE audit failed"
          }
          $releasedFiles = @(
            foreach ($smoke in @($report.integration_smoke_tests)) {
              if ($null -eq $smoke.PSObject.Properties['released_files']) {
                throw "SciPy verification smoke $($smoke.name) has no released_files evidence"
              }
              foreach ($path in @($smoke.released_files)) {
                "$($smoke.integration):$($smoke.name):$path"
              }
            }
          )
          if ($releasedFiles.Count -ne 0) {
            throw "SciPy verification released runtime files: $($releasedFiles -join ', ')"
          }
          $scipySmokes = @($report.integration_smoke_tests | Where-Object {
            $_.integration -eq 'scipy' -and $_.status -eq 'passed'
          })
          if ($scipySmokes.Count -ne 2) { throw "Both SciPy behavior smokes did not pass exactly once" }
          if (@($scipySmokes | Where-Object name -eq 'phase-1-extended-api-behavior').Count -ne 1) {
            throw "The extended SciPy API behavior smoke did not pass exactly once"
          }

          $exePath = Join-Path $resultRoot "staticpython-pack-verify.exe"
          $mapPath = Join-Path $resultRoot "staticpython-pack-verify.map"
          $exeSha256 = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $mapSha256 = (Get-FileHash -LiteralPath $mapPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeSha256 -ne $report.pe_audit.executable_sha256 -or $mapSha256 -ne $report.pe_audit.map_sha256) {
            throw "Uploaded SciPy verifier evidence does not match the report"
          }
          if (
            @($report.pe_audit.forbidden_dependencies).Count -ne 0 -or
            @($report.pe_audit.non_system_dependencies).Count -ne 0 -or
            @($report.pe_audit.forbidden_entry_symbols).Count -ne 0 -or
            @($report.pe_audit.main_object_records).Count -ne 0
          ) {
            throw "SciPy verifier report contains forbidden PE evidence"
          }
          $dependencyOutput = (& dumpbin /NOLOGO /DEPENDENTS $exePath | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "dumpbin could not re-audit the uploaded SciPy verifier" }
          $observedDependencies = @(
            $dependencyOutput -split "`r?`n" |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -match '(?i)^[a-z0-9_.-]+\.dll$' } |
              ForEach-Object { $_.ToUpperInvariant() } |
              Sort-Object -Unique
          )
          $reportedDependencies = @(
            $report.pe_audit.dependencies |
              ForEach-Object { $_.ToUpperInvariant() } |
              Sort-Object -Unique
          )
          if (
            $observedDependencies.Count -eq 0 -or
            @(Compare-Object $reportedDependencies $observedDependencies).Count -ne 0
          ) {
            throw "Uploaded SciPy verifier PE imports do not match its report"
          }

          @(
            "## Experimental SciPy static pack",
            "",
            "- CPython: ``$env:VERIFY_CPYTHON_VERSION``",
            "- SciPy: ``$($scipy.version)``",
            "- NumPy: ``$($metadataByName['numpy'].version)``",
            "- Runtime ABI: ``$($scipy.runtime_abi)``",
            "- Runtime extraction: ``false``",
            "- PE dependencies: $(@($report.pe_audit.dependencies) -join ', ')"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload SciPy static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scipy-static-1.17.1-${{ matrix.python_tag }}
          path: |
            dist/scipy-1.17.1/packs/*.zip
            dist/scipy-1.17.1/staticpython-pack-verify-report.json
            dist/scipy-1.17.1/staticpython-pack-verify.exe
            dist/scipy-1.17.1/staticpython-pack-verify.map
            dist/scipy-1.17.1/staticpython-pack-verify.pdb
          if-no-files-found: warn
          retention-days: 30
