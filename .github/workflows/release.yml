name: Publish verified wxPython candidate prerelease

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed SDK and pack release-candidate run
        required: true
        type: string
      full_run_id:
        description: Completed five-version full-profile validation run
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: staticpython-prerelease-publication
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SDK, pack, index, and full-profile gates
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          FULL_RUN_ID: ${{ inputs.full_run_id }}
        shell: pwsh
        run: |
          $source = gh run view $env:SOURCE_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --json status,conclusion,headSha,workflowName,jobs | ConvertFrom-Json
          if ($source.status -ne "completed" -or $source.conclusion -ne "success") {
            throw "SDK and pack source run is not successful"
          }
          if ($source.workflowName -ne "Build StaticPython Release") {
            throw "Unexpected SDK and pack workflow: $($source.workflowName)"
          }
          if ($source.headSha -notmatch "^[0-9a-f]{40}$") {
            throw "SDK and pack source run has no exact Git commit"
          }

          $unitJobs = @($source.jobs | Where-Object name -eq "unit-tests")
          $runtimeJobs = @($source.jobs | Where-Object name -like "runtime-sdk (*")
          $packJobs = @($source.jobs | Where-Object name -like "library-packs (*")
          $indexJobs = @($source.jobs | Where-Object name -eq "assemble-index")
          if ($unitJobs.Count -ne 1 -or $unitJobs[0].conclusion -ne "success") {
            throw "Source run does not have a successful unit-test gate"
          }
          if ($runtimeJobs.Count -ne 5 -or @($runtimeJobs | Where-Object conclusion -ne "success").Count -ne 0) {
            throw "Source run does not have five successful runtime SDK jobs"
          }
          if ($packJobs.Count -ne 20 -or @($packJobs | Where-Object conclusion -ne "success").Count -ne 0) {
            throw "Source run does not have twenty successful library-pack jobs"
          }
          if ($indexJobs.Count -ne 1 -or $indexJobs[0].conclusion -ne "success") {
            throw "Source run does not have a successful immutable index gate"
          }

          $full = gh run view $env:FULL_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --json status,conclusion,headSha,workflowName,jobs | ConvertFrom-Json
          if ($full.status -ne "completed" -or $full.conclusion -ne "success") {
            throw "Full-profile validation run is not successful"
          }
          if ($full.workflowName -ne "Validate wxPython full-profile candidate") {
            throw "Unexpected full-profile workflow: $($full.workflowName)"
          }
          if ($full.headSha -notmatch "^[0-9a-f]{40}$") {
            throw "Full-profile validation run has no exact Git commit"
          }

          $fullResolveJobs = @($full.jobs | Where-Object name -eq "resolve-cpython-matrix")
          $fullJobs = @($full.jobs | Where-Object name -like "full-conflict-regression (*")
          if ($fullResolveJobs.Count -ne 1 -or $fullResolveJobs[0].conclusion -ne "success") {
            throw "Full-profile run does not have a successful CPython matrix gate"
          }
          if ($fullJobs.Count -ne 5 -or @($fullJobs | Where-Object conclusion -ne "success").Count -ne 0) {
            throw "Full-profile run does not have five successful build jobs"
          }

          $fullCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$($full.headSha)" | ConvertFrom-Json
          $parents = @($fullCommit.parents)
          $files = @($fullCommit.files)
          if ($parents.Count -ne 1 -or $parents[0].sha -ne $source.headSha) {
            throw "Full-profile validation commit is not a direct child of the SDK and pack source commit"
          }
          if ($files.Count -ne 1 -or $files[0].filename -ne ".github/workflows/full-conflict-regression.yml") {
            throw "Full-profile validation commit changes files beyond its workflow trigger"
          }

          "sha=$($source.headSha)" >> $env:GITHUB_OUTPUT
          "full_sha=$($full.headSha)" >> $env:GITHUB_OUTPUT
      - name: Download verified immutable release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ steps.gates.outputs.sha }}
        shell: pwsh
        run: |
          gh run download $env:SOURCE_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name "staticpython-release-$env:SOURCE_SHA" `
            --dir .\dist
      - name: Publish immutable prerelease families
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python .\scripts\publish_release_assets.py
          --asset-root .\dist
          --repository "${{ github.repository }}"
          --source-commit "${{ steps.gates.outputs.sha }}"
      - name: Dispatch exact PySuture feature candidate verification
        env:
          DISPATCH_TOKEN: ${{ secrets.PYSUTURE_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ steps.gates.outputs.sha }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISPATCH_TOKEN)) {
            Write-Host "PYSUTURE_DISPATCH_TOKEN is not configured; scheduled polling remains active"
            exit 0
          }
          $headers = @{
            Authorization = "Bearer $env:DISPATCH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            ref = "feature/link-suppressions"
            inputs = @{
              staticpython_commit = $env:SOURCE_SHA
              propose_update = "false"
            }
          } | ConvertTo-Json -Depth 4
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/xqy2006/PySuture/actions/workflows/sync-staticpython.yml/dispatches" `
            -Headers $headers `
            -Body $body `
            -ContentType "application/json"
