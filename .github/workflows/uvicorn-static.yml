name: Experimental Uvicorn static pack

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/uvicorn-static.yml"
      - "Lib/click/**"
      - "Lib/colorama/**"
      - "assets/overlay/Include/staticpython_pack.h"
      - "assets/overlay/Python/staticpython_pack_runtime.c"
      - "build.py"
      - "config.json"
      - "libs.py"
      - "scripts/test_runtime_sdk.py"
      - "scripts/test_uvicorn_pack.py"
      - "scripts/uvicorn_runtime.py"
      - "scripts/verify_pack_with_runtime_sdk.py"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/uvicorn-static.yml"
      - "Lib/click/**"
      - "Lib/colorama/**"
      - "assets/overlay/Include/staticpython_pack.h"
      - "assets/overlay/Python/staticpython_pack_runtime.c"
      - "build.py"
      - "config.json"
      - "libs.py"
      - "scripts/test_runtime_sdk.py"
      - "scripts/test_uvicorn_pack.py"
      - "scripts/uvicorn_runtime.py"
      - "scripts/verify_pack_with_runtime_sdk.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staticpython-uvicorn-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  STATICPYTHON_BUILD_WORKERS: "2"

jobs:
  sdk-linked-uvicorn:
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpython_version: "3.11.15"
            python_tag: cp311
          - cpython_version: "3.12.13"
            python_tag: cp312
          - cpython_version: "3.13.15"
            python_tag: cp313
          - cpython_version: "3.14.7"
            python_tag: cp314
          - cpython_version: "3.15.0rc1"
            python_tag: cp315
    env:
      VERIFY_CPYTHON_VERSION: ${{ matrix.cpython_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install packaging
          choco install strawberryperl -y --no-progress

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Run Uvicorn and runtime SDK contract tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python .\scripts\test_uvicorn_pack.py
          python .\scripts\test_runtime_sdk.py

      - name: Build exact-commit audited runtime SDK
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "uvicorn-runtime-${{ matrix.python_tag }}"
          $runtimeDist = Join-Path $env:GITHUB_WORKSPACE "dist\runtime"
          New-Item -ItemType Directory -Force $runtimeDist | Out-Null
          python .\build.py `
            --cpython-version $env:VERIFY_CPYTHON_VERSION `
            --download-root $runtimeRoot `
            --profile runtime-sdk `
            --build-workers $env:STATICPYTHON_BUILD_WORKERS `
            --output-runtime-sdk-dir $runtimeDist

      - name: Build exact four-pack Uvicorn closure and run loopback smoke
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $runtimeSdk = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\dist\runtime" -Filter *.zip -File)
          if ($runtimeSdk.Count -ne 1) {
            throw "Expected exactly one runtime SDK archive, found $($runtimeSdk.Count)"
          }
          $packRoot = Join-Path $env:RUNNER_TEMP "uvicorn-pack-0.52.1"
          $resultRoot = Join-Path $env:GITHUB_WORKSPACE "dist\uvicorn-0.52.1"
          $packDist = Join-Path $resultRoot "packs"
          New-Item -ItemType Directory -Force $packDist | Out-Null
          python .\build.py `
            --cpython-version $env:VERIFY_CPYTHON_VERSION `
            --download-root $packRoot `
            --config .\config.json `
            --profile uvicorn-experimental `
            --pack-only `
            --pack-runtime-sdk $runtimeSdk[0].FullName `
            --build-workers $env:STATICPYTHON_BUILD_WORKERS `
            --output-pack-dir $packDist
          $sourceRoot = Join-Path $packRoot "cpython-$env:VERIFY_CPYTHON_VERSION"
          Copy-Item `
            -LiteralPath "$sourceRoot\PCbuild\staticpython-pack-verify-report.json" `
            -Destination "$resultRoot\staticpython-pack-verify-report.json"
          Copy-Item `
            -LiteralPath "$sourceRoot\PCbuild\staticpython-pack-verify\staticpython-pack-verify.map" `
            -Destination "$resultRoot\staticpython-pack-verify.map"
          Copy-Item `
            -LiteralPath "$sourceRoot\PCbuild\staticpython-pack-verify\staticpython-pack-verify.pdb" `
            -Destination "$resultRoot\staticpython-pack-verify.pdb"

      - name: Audit Uvicorn pack, no-extraction, and PE contracts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $resultRoot = Join-Path $env:GITHUB_WORKSPACE "dist\uvicorn-0.52.1"
          $packs = @(Get-ChildItem -LiteralPath "$resultRoot\packs" -Filter *.zip -File)
          if ($packs.Count -ne 4) { throw "Expected four dependency-complete Uvicorn packs, found $($packs.Count)" }

          $metadataByName = @{}
          foreach ($pack in $packs) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($pack.FullName)
            try {
              $names = @($archive.Entries | ForEach-Object FullName)
              $forbidden = @($names | Where-Object { [IO.Path]::GetExtension($_) -in @('.dll', '.pyd', '.exe') })
              if ($forbidden.Count -gt 0) { throw "$($pack.Name) contains dynamic/executable files: $($forbidden -join ', ')" }
              $entry = $archive.GetEntry("pack.json")
              if (-not $entry) { throw "$($pack.Name) has no pack.json" }
              $reader = [IO.StreamReader]::new($entry.Open())
              try { $metadata = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            } finally {
              $archive.Dispose()
            }
            if ($metadataByName.ContainsKey($metadata.name)) { throw "Duplicate pack identity $($metadata.name)" }
            if ($metadata.verification.status -ne 'passed') { throw "$($metadata.name) was not verified" }
            if ($metadata.license.status -ne 'complete') { throw "$($metadata.name) has incomplete license evidence" }
            $metadataByName[$metadata.name] = $metadata
          }

          $expected = [ordered]@{
            colorama = @('0.4.6', '08695f5cb7ed6e0531a20572697297273c47b8cae5a63ffc6d6ed5c201be6e44', 'BSD-3-Clause')
            click = @('8.4.2', '9a6cea6e60b17ebe0a44c5cc636d94f09bd66142c1cd7d8b4cd731c4917a15f6', 'BSD-3-Clause')
            h11 = @('0.16.0', '4e35b956cf45792e4caa5885e69fba00bdbc6ffafbfa020300e549b208ee5ff1', 'MIT')
            uvicorn = @('0.52.1', '112ec661814189acbccd3f7b86460147cc065fc92c0821afa78918780e4354dd', 'BSD-3-Clause')
          }
          foreach ($name in $expected.Keys) {
            if (-not $metadataByName.ContainsKey($name)) { throw "Missing dependency pack $name" }
            $metadata = $metadataByName[$name]
            if ($metadata.version -ne $expected[$name][0]) { throw "Unexpected $name version $($metadata.version)" }
            if ($metadata.source_archive_sha256 -ne $expected[$name][1]) { throw "$name source archive hash is not pinned" }
            if ($metadata.license.expression -ne $expected[$name][2]) { throw "Unexpected $name license $($metadata.license.expression)" }
          }

          if ((@($metadataByName['click'].dependencies) -join ',') -ne 'colorama') {
            throw "Click pack does not declare its Windows Colorama dependency"
          }
          if ((@($metadataByName['uvicorn'].dependencies) -join ',') -ne 'click,h11') {
            throw "Uvicorn pack does not declare the minimal HTTP dependency closure"
          }

          $report = Get-Content -LiteralPath "$resultRoot\staticpython-pack-verify-report.json" -Raw | ConvertFrom-Json
          if ($report.status -ne 'passed' -or $report.pe_audit.status -ne 'passed') {
            throw "SDK-linked Uvicorn behavior or PE audit failed"
          }
          $releasedFiles = @(
            foreach ($smoke in @($report.integration_smoke_tests)) {
              if ($null -eq $smoke.PSObject.Properties['released_files']) {
                throw "Uvicorn verification smoke $($smoke.name) has no released_files evidence"
              }
              foreach ($path in @($smoke.released_files)) {
                "$($smoke.integration):$($smoke.name):$path"
              }
            }
          )
          if ($releasedFiles.Count -ne 0) {
            throw "Uvicorn verification released runtime files: $($releasedFiles -join ', ')"
          }
          $forbiddenPe = @($report.pe_audit.dependencies | Where-Object {
            $_ -match '^(python.*\.dll|vcruntime.*\.dll|msvcp.*\.dll)$'
          })
          if ($forbiddenPe.Count -gt 0) {
            throw "Uvicorn verifier imports forbidden runtime DLLs: $($forbiddenPe -join ', ')"
          }
          $uvicornSmokes = @($report.integration_smoke_tests | Where-Object {
            $_.integration -eq 'uvicorn' -and
            $_.name -eq 'h11-loopback-asgi-server' -and
            $_.status -eq 'passed'
          })
          if ($uvicornSmokes.Count -ne 1) { throw "Uvicorn loopback ASGI behavior smoke did not pass exactly once" }

          @(
            "## Experimental Uvicorn static pack",
            "",
            "- CPython: ``$env:VERIFY_CPYTHON_VERSION``",
            "- Uvicorn: ``$($metadataByName['uvicorn'].version)``",
            "- HTTP backend: ``h11 $($metadataByName['h11'].version)``",
            "- Runtime ABI: ``$($metadataByName['uvicorn'].runtime_abi)``",
            "- Packs: $($expected.Keys -join ', ')",
            "- PE dependencies: $(@($report.pe_audit.dependencies) -join ', ')"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload Uvicorn static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-static-0.52.1-${{ matrix.python_tag }}
          path: |
            dist/uvicorn-0.52.1/packs/*.zip
            dist/uvicorn-0.52.1/staticpython-pack-verify-report.json
            dist/uvicorn-0.52.1/staticpython-pack-verify.map
            dist/uvicorn-0.52.1/staticpython-pack-verify.pdb
          if-no-files-found: warn
          retention-days: 30
