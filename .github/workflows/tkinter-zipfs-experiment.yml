name: Experimental tkinter static ZipFS pack

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/tkinter-zipfs-experiment.yml"
      - "assets/overlay/Tools/build/freeze_modules.py"
      - "build.py"
      - "config.json"
      - "pack_evidence.py"
      - "Lib/tkinter/setup.py"
      - "scripts/tcltk_zipfs.py"
      - "scripts/test_tcltk_zipfs.py"
      - "TKINTER_ZIPFS.md"
  pull_request:
    paths:
      - ".github/workflows/tkinter-zipfs-experiment.yml"
      - "assets/overlay/Tools/build/freeze_modules.py"
      - "build.py"
      - "config.json"
      - "pack_evidence.py"
      - "Lib/tkinter/setup.py"
      - "scripts/tcltk_zipfs.py"
      - "scripts/test_tcltk_zipfs.py"
      - "TKINTER_ZIPFS.md"
  workflow_dispatch:
    inputs:
      cpython_version:
        description: Exact CPython patch release to validate
        required: true
        default: "3.13.15"
        type: string

permissions:
  contents: read

concurrency:
  group: staticpython-tkinter-zipfs-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  STATICPYTHON_BUILD_WORKERS: "2"
  VERIFY_CPYTHON_VERSION: ${{ inputs.cpython_version || '3.13.15' }}

jobs:
  sdk-linked-tkinter:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install packaging
          choco install strawberryperl -y --no-progress

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Run deterministic ZipFS and pack unit tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python .\scripts\test_tcltk_zipfs.py
          python .\scripts\test_runtime_resources.py
          python .\scripts\test_runtime_sdk.py

      - name: Build exact-commit audited runtime SDK
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "tkinter-runtime"
          $runtimeDist = Join-Path $env:GITHUB_WORKSPACE "dist\tkinter\runtime"
          New-Item -ItemType Directory -Force $runtimeDist | Out-Null
          python .\build.py `
            --cpython-version $env:VERIFY_CPYTHON_VERSION `
            --download-root $runtimeRoot `
            --profile runtime-sdk `
            --build-workers $env:STATICPYTHON_BUILD_WORKERS `
            --output-runtime-sdk-dir $runtimeDist

      - name: Build static tkinter pack and verify against runtime SDK
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $runtimeSdk = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\dist\tkinter\runtime" -Filter *.zip -File)
          if ($runtimeSdk.Count -ne 1) {
            throw "Expected exactly one runtime SDK archive, found $($runtimeSdk.Count)"
          }
          $packRoot = Join-Path $env:RUNNER_TEMP "tkinter-pack"
          $resultRoot = Join-Path $env:GITHUB_WORKSPACE "dist\tkinter"
          $packDist = Join-Path $resultRoot "packs"
          New-Item -ItemType Directory -Force $packDist | Out-Null
          $sourceRoot = Join-Path $packRoot "cpython-$env:VERIFY_CPYTHON_VERSION"
          try {
            python .\build.py `
              --cpython-version $env:VERIFY_CPYTHON_VERSION `
              --download-root $packRoot `
              --profile tkinter-experimental `
              --pack-only `
              --pack-runtime-sdk $runtimeSdk[0].FullName `
              --build-workers $env:STATICPYTHON_BUILD_WORKERS `
              --output-pack-dir $packDist `
              --output-pack-name tkinter
          } finally {
            $evidence = @{
              "$sourceRoot\PCbuild\staticpython-pack-verify-report.json" = "$resultRoot\staticpython-pack-verify-report.json"
              "$sourceRoot\PCbuild\staticpython-pack-verify\staticpython-pack-verify.exe" = "$resultRoot\staticpython-pack-verify.exe"
              "$sourceRoot\PCbuild\staticpython-pack-verify\staticpython-pack-verify.map" = "$resultRoot\staticpython-pack-verify.map"
              "$sourceRoot\PCbuild\staticpython-pack-verify\staticpython-pack-verify.pdb" = "$resultRoot\staticpython-pack-verify.pdb"
            }
            foreach ($source in $evidence.Keys) {
              if (Test-Path -LiteralPath $source -PathType Leaf) {
                Copy-Item -LiteralPath $source -Destination $evidence[$source]
              }
            }
          }

      - name: Assert no-extraction pack evidence
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $resultRoot = Join-Path $env:GITHUB_WORKSPACE "dist\tkinter"
          $packs = @(Get-ChildItem -LiteralPath "$resultRoot\packs" -Filter *.zip -File)
          if ($packs.Count -ne 1) { throw "Expected exactly one tkinter pack, found $($packs.Count)" }
          $reportPath = "$resultRoot\staticpython-pack-verify-report.json"
          python .\pack_evidence.py --report $reportPath --pack $packs[0].FullName
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packs[0].FullName)
          try {
            $entry = $archive.GetEntry("pack.json")
            if (-not $entry) { throw "tkinter pack has no pack.json" }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { $metadata = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
          } finally {
            $archive.Dispose()
          }
          if ($metadata.verification.status -ne "passed") {
            throw "tkinter pack was not promoted to verification=passed"
          }
          $failedSmokes = @($metadata.verification.smoke_tests | Where-Object status -ne "passed")
          if ($failedSmokes.Count -gt 0 -or @($metadata.verification.smoke_tests).Count -lt 2) {
            throw "tkinter Tcl/Tk behavior smoke evidence is incomplete"
          }
          $resourcePaths = @($metadata.resources | ForEach-Object path)
          if ($resourcePaths.Count -ne 1 -or $resourcePaths[0] -ne "Lib/tkinter/_staticpython/tcltk-library.zip") {
            throw "tkinter pack resource boundary is not the exact ZipFS image"
          }
          foreach ($library in @(
            "_tkinter.lib",
            "staticpython_tk.lib",
            "staticpython_tclstub.lib",
            "staticpython_tcl.lib"
          )) {
            if ($library -notin @($metadata.libraries)) { throw "tkinter pack is missing $library" }
          }
          if ($metadata.license.status -ne "complete" -or @($metadata.license.files).Count -ne 6) {
            throw "Tcl/Tk license evidence is incomplete"
          }
          foreach ($license in @(
            "licenses/LICENSE",
            "licenses/tcl-license.terms",
            "licenses/tk-license.terms",
            "licenses/zlib-LICENSE",
            "licenses/libtommath-LICENSE",
            "licenses/minizip-LICENSE.Info-Zip"
          )) {
            if ($license -notin @($metadata.license.files)) {
              throw "tkinter pack is missing required license evidence $license"
            }
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.status -ne "passed" -or $report.pe_audit.status -ne "passed") {
            throw "SDK-linked tkinter verification or PE audit did not pass"
          }
          $exePath = "$resultRoot\staticpython-pack-verify.exe"
          $mapPath = "$resultRoot\staticpython-pack-verify.map"
          $pdbPath = "$resultRoot\staticpython-pack-verify.pdb"
          foreach ($evidencePath in @($exePath, $mapPath, $pdbPath)) {
            if (
              -not (Test-Path -LiteralPath $evidencePath -PathType Leaf) -or
              (Get-Item -LiteralPath $evidencePath).Length -le 0
            ) {
              throw "tkinter verifier evidence is missing or empty: $evidencePath"
            }
          }
          $exeSha256 = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (
            $exeSha256 -ne $report.executable_sha256 -or
            $exeSha256 -ne $report.pe_audit.executable_sha256
          ) {
            throw "uploaded tkinter verifier executable hash does not match its report"
          }
          $mapSha256 = (Get-FileHash -LiteralPath $mapPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($mapSha256 -ne $report.pe_audit.map_sha256) {
            throw "uploaded tkinter verifier map hash does not match its report"
          }
          if (
            @($report.pe_audit.forbidden_dependencies).Count -ne 0 -or
            @($report.pe_audit.non_system_dependencies).Count -ne 0 -or
            @($report.pe_audit.forbidden_entry_symbols).Count -ne 0 -or
            @($report.pe_audit.main_object_records).Count -ne 0
          ) {
            throw "tkinter verifier report contains forbidden PE evidence"
          }
          $dependencyOutput = (& dumpbin /NOLOGO /DEPENDENTS $exePath | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin could not re-audit the uploaded tkinter verifier executable"
          }
          $observedDependencies = @(
            $dependencyOutput -split "`r?`n" |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -match '(?i)^[a-z0-9_.-]+\.dll$' } |
              ForEach-Object { $_.ToUpperInvariant() } |
              Sort-Object -Unique
          )
          $reportedDependencies = @(
            $report.pe_audit.dependencies |
              ForEach-Object { $_.ToUpperInvariant() } |
              Sort-Object -Unique
          )
          if (
            $observedDependencies.Count -eq 0 -or
            @(Compare-Object $reportedDependencies $observedDependencies).Count -ne 0
          ) {
            throw "uploaded tkinter verifier PE imports do not match its report"
          }
          @(
            "## Experimental tkinter ZipFS pack",
            "",
            "- CPython: ``$env:VERIFY_CPYTHON_VERSION``",
            "- Tcl/Tk: ``9.0.4``",
            "- Runtime extraction: ``false``",
            "- Smoke tests: $(@($report.integration_smoke_tests).Count)",
            "- PE dependencies: $(@($report.pe_audit.dependencies) -join ', ')"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload tkinter pack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkinter-zipfs-pack-${{ env.VERIFY_CPYTHON_VERSION }}
          path: |
            dist/tkinter/packs/*.zip
            dist/tkinter/staticpython-pack-verify-report.json
            dist/tkinter/staticpython-pack-verify.exe
            dist/tkinter/staticpython-pack-verify.map
            dist/tkinter/staticpython-pack-verify.pdb
          if-no-files-found: warn
          retention-days: 30
