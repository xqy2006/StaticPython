name: Weekly full library history

on:
  pull_request:
    paths:
      - ".github/workflows/library-history-weekly.yml"
      - ".github/workflows/library-history-shard.yml"
      - "scripts/*library*history*.py"
      - "scripts/run_library_history_batch.py"
      - "scripts/library_version_contract.py"
      - "scripts/library_contract_build.py"
      - "scripts/build_library_contract_config.py"
      - "scripts/verify_pack_with_runtime_sdk.py"
      - "build.py"
      - "config.json"
      - "Lib/**"
      - "libs.py"
      - "manifest.json"
      - "verify.py"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      libraries:
        description: "Comma-separated integration names for an exact targeted history gate; empty runs full history."
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: staticpython-library-history-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  STATICPYTHON_HISTORY_BUILD_WORKERS: "2"

jobs:
  plan:
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      contract_sha256: ${{ steps.plan.outputs.contract_sha256 }}
      manifest_sha256: ${{ steps.plan.outputs.manifest_sha256 }}
      manifest_key: ${{ steps.plan.outputs.manifest_key }}
      plan_artifact: ${{ steps.plan.outputs.plan_artifact }}
      has_batches: ${{ steps.plan.outputs.has_batches }}
      shard_matrix: ${{ steps.plan.outputs.shard_matrix }}
      runtime_matrix: ${{ steps.plan.outputs.runtime_matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install history planning dependencies
        run: python -m pip install packaging

      - name: Run weekly history unit tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python .\scripts\test_prepare_library_history_batches.py
          python .\scripts\test_prepare_library_contract_matrix.py
          python .\scripts\test_library_history_evidence.py
          python .\scripts\test_run_library_history_batch.py
          python .\scripts\test_build_library_contract_config.py
          python .\scripts\test_library_contract_build.py
          python .\scripts\test_verify_pack_with_runtime_sdk.py

      - name: Download previous last-known-good version contract
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $planRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp\history-plan"
          $lookupRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp\history-contract-lookup"
          New-Item -ItemType Directory -Force -Path $planRoot, $lookupRoot | Out-Null
          $apiPath = "repos/${{ github.repository }}/actions/workflows/library-version-discovery.yml/runs?branch=master&per_page=100"
          $runs = @((gh api $apiPath | ConvertFrom-Json).workflow_runs) |
            Where-Object { $_.status -eq "completed" } |
            Sort-Object created_at -Descending
          if ($runs.Count -eq 0) {
            throw "No completed master library-version contract run is available"
          }

          $resolved = $false
          foreach ($priorRun in $runs) {
            $artifacts = @((gh api "repos/${{ github.repository }}/actions/runs/$($priorRun.id)/artifacts?name=library-contract-catalog&per_page=100" | ConvertFrom-Json).artifacts)
            $catalog = $artifacts |
              Where-Object { $_.name -eq "library-contract-catalog" -and -not $_.expired } |
              Select-Object -First 1
            if (-not $catalog) { continue }
            $downloadRoot = Join-Path $lookupRoot "catalog-$($priorRun.id)"
            New-Item -ItemType Directory -Force $downloadRoot | Out-Null
            gh run download $priorRun.id `
              --repo "${{ github.repository }}" `
              --name "library-contract-catalog" `
              --dir $downloadRoot
            $indexPath = Join-Path $downloadRoot "index.v1.json"
            if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) {
              throw "Library contract catalog from run $($priorRun.id) has no index.v1.json"
            }
            $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
            if (-not $index.active -or [string]::IsNullOrWhiteSpace([string]$index.active.contract)) {
              continue
            }
            $catalogRoot = [System.IO.Path]::GetFullPath($downloadRoot).TrimEnd('\', '/') + [System.IO.Path]::DirectorySeparatorChar
            $activeContract = [System.IO.Path]::GetFullPath(
              (Join-Path $downloadRoot ([string]$index.active.contract))
            )
            if (-not $activeContract.StartsWith($catalogRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Library contract catalog active path escapes its artifact root"
            }
            if (-not (Test-Path -LiteralPath $activeContract -PathType Leaf)) {
              throw "Library contract catalog is missing its active contract"
            }
            Copy-Item -LiteralPath $activeContract -Destination (Join-Path $planRoot "previous-library-version-contract.json") -Force
            [ordered]@{
              workflow = "library-version-discovery.yml"
              run_id = [string]$priorRun.id
              run_url = [string]$priorRun.html_url
              artifact = "library-contract-catalog"
              selection = "active-last-known-good"
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $planRoot "previous-contract-source.v1.json") -Encoding utf8
            $resolved = $true
            break
          }

          if (-not $resolved) {
            foreach ($priorRun in @($runs | Where-Object { $_.conclusion -eq "success" })) {
              $artifacts = @((gh api "repos/${{ github.repository }}/actions/runs/$($priorRun.id)/artifacts?name=library-version-contract&per_page=100" | ConvertFrom-Json).artifacts)
              $legacy = $artifacts |
                Where-Object { $_.name -eq "library-version-contract" -and -not $_.expired } |
                Select-Object -First 1
              if (-not $legacy) { continue }
              $downloadRoot = Join-Path $lookupRoot "legacy-$($priorRun.id)"
              New-Item -ItemType Directory -Force $downloadRoot | Out-Null
              gh run download $priorRun.id `
                --repo "${{ github.repository }}" `
                --name "library-version-contract" `
                --dir $downloadRoot
              $legacyContract = Join-Path $downloadRoot "library-version-contract.json"
              if (-not (Test-Path -LiteralPath $legacyContract -PathType Leaf)) {
                throw "Legacy contract artifact from run $($priorRun.id) has no contract JSON"
              }
              Copy-Item -LiteralPath $legacyContract -Destination (Join-Path $planRoot "previous-library-version-contract.json") -Force
              [ordered]@{
                workflow = "library-version-discovery.yml"
                run_id = [string]$priorRun.id
                run_url = [string]$priorRun.html_url
                artifact = "library-version-contract"
                selection = "legacy-discovery-baseline"
              } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $planRoot "previous-contract-source.v1.json") -Encoding utf8
              $resolved = $true
              break
            }
          }
          if (-not $resolved) {
            throw "No live active catalog or legacy successful contract artifact is available"
          }

      - name: Resolve latest CPython 3.11 through 3.15 tags
        id: history-versions
        shell: pwsh
        run: |
          $tags = @(git ls-remote --tags --refs https://github.com/python/cpython.git "v3.*" |
            ForEach-Object {
              if ($_ -match "refs/tags/v((3)\.(11|12|13|14|15)\.([0-9]+)(?:(a|b|rc)([0-9]+))?)$") {
                $phaseRank = switch ($matches[5]) { "a" { 1 } "b" { 2 } "rc" { 3 } default { 4 } }
                [PSCustomObject]@{
                  Version = $matches[1]
                  Series = "3.$($matches[3])"
                  Major = [int]$matches[2]
                  Minor = [int]$matches[3]
                  Micro = [int]$matches[4]
                  PhaseRank = $phaseRank
                  PhaseSerial = if ($matches[6]) { [int]$matches[6] } else { 0 }
                }
              }
            })
          if (-not $tags) { throw "Could not resolve CPython tags" }
          $versions = foreach ($series in @("3.11", "3.12", "3.13", "3.14", "3.15")) {
            $latest = $tags | Where-Object Series -eq $series |
              Sort-Object Major, Minor, Micro, PhaseRank, PhaseSerial | Select-Object -Last 1
            if (-not $latest) { throw "Could not resolve CPython $series" }
            $latest.Version
          }
          "versions=$(ConvertTo-Json -InputObject @($versions) -Compress)" >> $env:GITHUB_OUTPUT

      - name: Discover current source version contract
        shell: pwsh
        env:
          CPYTHON_VERSIONS_JSON: ${{ steps.history-versions.outputs.versions }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $planRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp\history-plan"
          $contractPath = Join-Path $planRoot "library-version-contract.json"
          $deltaPath = Join-Path $planRoot "library-version-delta.json"
          $previousPath = Join-Path $planRoot "previous-library-version-contract.json"
          $contractArgs = @(
            ".\scripts\library_version_contract.py",
            "--output", $contractPath,
            "--delta-output", $deltaPath
          )
          @($env:CPYTHON_VERSIONS_JSON | ConvertFrom-Json) | ForEach-Object {
            $contractArgs += @("--python-version", $_)
          }
          if (Test-Path -LiteralPath $previousPath -PathType Leaf) {
            $contractArgs += @("--previous", $previousPath)
          }
          python @contractArgs
          $delta = Get-Content -LiteralPath $deltaPath -Raw | ConvertFrom-Json
          if (@($delta.drifted_candidates).Count -gt 0 -or @($delta.regressions).Count -gt 0) {
            throw "Current history contract contains source drift or a candidate regression"
          }
          $previousSourcePath = Join-Path $planRoot "previous-contract-source.v1.json"
          $previousSource = if (Test-Path -LiteralPath $previousSourcePath -PathType Leaf) {
            Get-Content -LiteralPath $previousSourcePath -Raw | ConvertFrom-Json
          } else { $null }
          [ordered]@{
            workflow = "library-history-weekly.yml"
            run_id = "${{ github.run_id }}"
            run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            selection = "current-source-discovery"
            source_commit = "${{ github.sha }}"
            source_ref = "${{ github.ref }}"
            previous_contract_source = $previousSource
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $planRoot "contract-source.v1.json") -Encoding utf8

      - name: Download previous last-known-good history support
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $planRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp\history-plan"
          $lookupRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp\history-support-lookup"
          New-Item -ItemType Directory -Force $lookupRoot | Out-Null
          $oldPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $responseText = gh api "repos/${{ github.repository }}/actions/workflows/library-history-weekly.yml/runs?branch=master&per_page=100" 2>$null
          $apiExitCode = $LASTEXITCODE
          $ErrorActionPreference = $oldPreference
          if ($apiExitCode -ne 0) {
            Write-Host "No previous weekly workflow is registered yet"
            exit 0
          }
          $runs = @(($responseText | ConvertFrom-Json).workflow_runs) |
            Where-Object {
              $_.status -eq "completed" -and [string]$_.id -ne "${{ github.run_id }}"
            } |
            Sort-Object created_at -Descending
          foreach ($priorRun in $runs) {
            $artifacts = @((gh api "repos/${{ github.repository }}/actions/runs/$($priorRun.id)/artifacts?name=library-history-support-catalog&per_page=100" | ConvertFrom-Json).artifacts)
            $catalog = $artifacts |
              Where-Object { $_.name -eq "library-history-support-catalog" -and -not $_.expired } |
              Select-Object -First 1
            if (-not $catalog) { continue }
            $downloadRoot = Join-Path $lookupRoot "catalog-$($priorRun.id)"
            New-Item -ItemType Directory -Force $downloadRoot | Out-Null
            gh run download $priorRun.id `
              --repo "${{ github.repository }}" `
              --name "library-history-support-catalog" `
              --dir $downloadRoot
            $indexPath = Join-Path $downloadRoot "index.v1.json"
            if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) {
              throw "History support catalog from run $($priorRun.id) has no index.v1.json"
            }
            $destination = Join-Path $planRoot "previous-catalog"
            New-Item -ItemType Directory -Force $destination | Out-Null
            $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
            if ($index.active -and -not [string]::IsNullOrWhiteSpace([string]$index.active.support)) {
              $catalogRoot = [System.IO.Path]::GetFullPath($downloadRoot).TrimEnd('\', '/') + [System.IO.Path]::DirectorySeparatorChar
              $activeSupport = [System.IO.Path]::GetFullPath(
                (Join-Path $downloadRoot ([string]$index.active.support))
              )
              if (-not $activeSupport.StartsWith($catalogRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "History support catalog active path escapes its artifact root"
              }
              if (-not (Test-Path -LiteralPath $activeSupport -PathType Leaf)) {
                throw "History support catalog is missing its active support document"
              }
            }
            Copy-Item -Path (Join-Path $downloadRoot "*") -Destination $destination -Recurse -Force
            Write-Host "Using history last-known-good catalog from completed master run $($priorRun.id)"
            break
          }

      - name: Prepare deterministic history shards
        id: plan
        shell: pwsh
        env:
          STATICPYTHON_TARGET_LIBRARIES: ${{ inputs.libraries }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $planRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp\history-plan"
          $manifestPath = Join-Path $planRoot "library-history-manifest.json"
          $planArgs = @(
            ".\scripts\prepare_library_history_batches.py",
            "--contract", (Join-Path $planRoot "library-version-contract.json"),
            "--output", $manifestPath
          )
          if ("${{ github.event_name }}" -eq "pull_request") {
            $planArgs += @(
              "--smoke-library", "six",
              "--smoke-python-series", "3.13",
              "--pure-batch-size", "1",
              "--native-batch-size", "1",
              "--max-jobs-per-run", "1"
            )
          } elseif (
            "${{ github.event_name }}" -eq "workflow_dispatch" -and
            -not [string]::IsNullOrWhiteSpace($env:STATICPYTHON_TARGET_LIBRARIES)
          ) {
            $requestedLibraries = @(
              $env:STATICPYTHON_TARGET_LIBRARIES.Split(',') |
                ForEach-Object { $_.Trim() } |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
            if ($requestedLibraries.Count -eq 0) {
              throw "Targeted history input contains no library names"
            }
            foreach ($library in $requestedLibraries) {
              $planArgs += @("--library", $library)
            }
          }
          python @planArgs
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifestHashKey = ([string]$manifest.manifest_sha256).Substring(0, 16)
          $artifactSuffix = "a${{ github.run_attempt }}"
          $manifestKey = "$manifestHashKey-$artifactSuffix"
          $planArtifact = "library-history-plan-$manifestKey"
          $shardMatrix = [ordered]@{
            include = @($manifest.run_shards | ForEach-Object {
              [ordered]@{ shard_index = [int]$_.shard_index }
            })
          }
          $runtimeMatrix = [ordered]@{
            include = @($manifest.batches |
              ForEach-Object { [string]$_.python_version } |
              Sort-Object -Unique |
              ForEach-Object {
                [ordered]@{
                  python_version = [string]$_
                  runtime_artifact = "library-history-runtime-$(([string]$manifest.contract_sha256).Substring(0, 16))-py$_-$artifactSuffix"
                }
              })
          }
          "contract_sha256=$($manifest.contract_sha256)" >> $env:GITHUB_OUTPUT
          "manifest_sha256=$($manifest.manifest_sha256)" >> $env:GITHUB_OUTPUT
          "manifest_key=$manifestKey" >> $env:GITHUB_OUTPUT
          "plan_artifact=$planArtifact" >> $env:GITHUB_OUTPUT
          "has_batches=$(([bool]($manifest.batch_count -gt 0)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "shard_matrix=$(ConvertTo-Json $shardMatrix -Depth 5 -Compress)" >> $env:GITHUB_OUTPUT
          "runtime_matrix=$(ConvertTo-Json $runtimeMatrix -Depth 5 -Compress)" >> $env:GITHUB_OUTPUT
          @(
            "## Weekly library history plan",
            "",
            "- Contract: ``$($manifest.contract_sha256)``",
            "- Manifest: ``$($manifest.manifest_sha256)``",
            "- Selection: ``$($manifest.selection.mode)``",
            "- Combinations: $($manifest.combination_count)",
            "- Batch jobs: $($manifest.batch_count)",
            "- Run shards: $($manifest.run_shard_count)",
            "- Runtime SDKs: $(@($runtimeMatrix.include).Count)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload immutable weekly plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.plan_artifact }}
          path: |
            .tmp/history-plan/library-version-contract.json
            .tmp/history-plan/library-version-delta.json
            .tmp/history-plan/contract-source.v1.json
            .tmp/history-plan/library-history-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload previous last-known-good support for promotion
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.plan_artifact }}-previous-support
          path: .tmp/history-plan/previous-catalog/**
          if-no-files-found: ignore
          retention-days: 90

  runtime-sdks:
    needs: plan
    if: ${{ needs.plan.outputs.has_batches == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.runtime_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime SDK build dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install packaging
          choco install strawberryperl -y --no-progress

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build exact-commit runtime SDK
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "library-history-runtime-${{ matrix.python_version }}"
          $runtimeDist = Join-Path $env:GITHUB_WORKSPACE ".tmp\runtime-dist"
          New-Item -ItemType Directory -Force $runtimeDist | Out-Null
          python .\build.py `
            --cpython-version "${{ matrix.python_version }}" `
            --download-root $runtimeRoot `
            --profile runtime-sdk `
            --build-workers $env:STATICPYTHON_HISTORY_BUILD_WORKERS `
            --output-runtime-sdk-dir $runtimeDist

      - name: Upload immutable runtime SDK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime_artifact }}
          path: .tmp/runtime-dist/*.zip
          if-no-files-found: error
          retention-days: 90

  history-shards:
    needs: [plan, runtime-sdks]
    if: ${{ needs.plan.outputs.has_batches == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.shard_matrix) }}
    uses: ./.github/workflows/library-history-shard.yml
    with:
      plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      manifest_key: ${{ needs.plan.outputs.manifest_key }}
      contract_sha256: ${{ needs.plan.outputs.contract_sha256 }}
      manifest_sha256: ${{ needs.plan.outputs.manifest_sha256 }}
      artifact_suffix: a${{ github.run_attempt }}
      shard_index: ${{ matrix.shard_index }}

  promote-support:
    needs: [plan, runtime-sdks, history-shards]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install promotion dependencies
        run: python -m pip install packaging

      - name: Download immutable weekly plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: .tmp/history-plan

      - name: Download previous last-known-good support
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}-previous-support
          path: .tmp/history-plan/previous-catalog

      - name: Download completed shard evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: library-history-shard-${{ needs.plan.outputs.manifest_key }}-s*
          path: .tmp/shard-evidence

      - name: Evaluate history support promotion
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $mode = if (
            "${{ github.event_name }}" -eq "pull_request" -or
            "${{ github.ref_name }}" -ne "master"
          ) { "preview" } else { "promote" }
          $promotionArgs = @(
            ".\scripts\library_history_evidence.py", "promote",
            "--contract", ".tmp\history-plan\library-version-contract.json",
            "--contract-source", ".tmp\history-plan\contract-source.v1.json",
            "--manifest", ".tmp\history-plan\library-history-manifest.json",
            "--shard-evidence-root", ".tmp\shard-evidence",
            "--mode", $mode,
            "--output", ".tmp\history-support-catalog",
            "--repository", "${{ github.repository }}",
            "--run-id", "${{ github.run_id }}",
            "--run-attempt", "${{ github.run_attempt }}",
            "--run-url", "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "--source-commit", "${{ github.sha }}",
            "--source-ref", "${{ github.ref }}",
            "--event-name", "${{ github.event_name }}",
            "--artifact", "library-history-support-catalog"
          )
          $previousCatalog = ".tmp\history-plan\previous-catalog"
          if (Test-Path -LiteralPath (Join-Path $previousCatalog "index.v1.json") -PathType Leaf) {
            $promotionArgs += @("--previous-catalog", $previousCatalog)
          }
          python @promotionArgs

      - name: Add support decision to summary
        if: always()
        shell: pwsh
        run: |
          $summary = ".tmp\history-support-catalog\promotion-summary.md"
          if (Test-Path -LiteralPath $summary -PathType Leaf) {
            Get-Content -LiteralPath $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload candidate and last-known-good support catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-history-support-catalog
          path: .tmp/history-support-catalog/**
          if-no-files-found: error
          retention-days: 90

      - name: Enforce history support gate
        if: always()
        shell: pwsh
        run: |
          $indexPath = ".tmp\history-support-catalog\index.v1.json"
          if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) {
            throw "History promotion did not produce index.v1.json"
          }
          $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
          if ($index.decision.gate -ne "passed") {
            $codes = @($index.decision.blockers | ForEach-Object { $_.code }) -join ", "
            throw "History support promotion is frozen: $codes"
          }
