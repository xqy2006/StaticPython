name: Validate Library Patch Matrix

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      cpython_version:
        description: CPython version, for example 3.13.13 or 3.15.0a8
        required: true
        default: 3.13.13

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  DEFAULT_CPYTHON_VERSION: "3.13.13"
  LIBRARY_PATCH_SHARD_COUNT: "8"

jobs:
  resolve-cpython-matrix:
    runs-on: windows-2022
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}

    steps:
      - name: Resolve CPython version matrix
        id: resolve
        shell: pwsh
        run: |
          $manualVersion = "${{ inputs.cpython_version }}".Trim()
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if ([string]::IsNullOrWhiteSpace($manualVersion)) {
              $manualVersion = $env:DEFAULT_CPYTHON_VERSION
            }
            $versionsJson = ConvertTo-Json -InputObject @($manualVersion) -Compress
            "versions=$versionsJson" >> $env:GITHUB_OUTPUT
            Write-Host "Using manually requested CPython version: $manualVersion"
            exit 0
          }

          $tags = @(git ls-remote --tags --refs https://github.com/python/cpython.git "v3.*" |
            ForEach-Object {
              if ($_ -match "refs/tags/v((3)\.(11|12|13|14|15)\.([0-9]+)(?:(a|b|rc)([0-9]+))?)$") {
                $phase = $matches[5]
                $phaseRank = 4
                if ($phase -eq "a") {
                  $phaseRank = 1
                }
                elseif ($phase -eq "b") {
                  $phaseRank = 2
                }
                elseif ($phase -eq "rc") {
                  $phaseRank = 3
                }
                [PSCustomObject]@{
                  Version = $matches[1]
                  Series = "3.$($matches[3])"
                  Major = [int]$matches[2]
                  Minor = [int]$matches[3]
                  Micro = [int]$matches[4]
                  PhaseRank = $phaseRank
                  PhaseSerial = if ($matches[6]) { [int]$matches[6] } else { 0 }
                }
              }
            })
          if (-not $tags) {
            throw "Could not resolve CPython tags from python/cpython"
          }

          $versions = foreach ($series in @("3.11", "3.12", "3.13", "3.14", "3.15")) {
            $latest = $tags |
              Where-Object { $_.Series -eq $series } |
              Sort-Object Major, Minor, Micro, PhaseRank, PhaseSerial |
              Select-Object -Last 1
            if (-not $latest) {
              throw "Could not resolve latest CPython $series version"
            }
            $latest.Version
          }

          $versionsJson = ConvertTo-Json -InputObject @($versions) -Compress
          "versions=$versionsJson" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved CPython versions: $($versions -join ', ')"

  resolve-library-shards:
    runs-on: windows-2022
    outputs:
      shards: ${{ steps.resolve.outputs.shards }}
      has_libraries: ${{ steps.resolve.outputs.has_libraries }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve library shards
        id: resolve
        shell: pwsh
        run: |
          @'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path


          def run_git(*args: str, check: bool = True) -> subprocess.CompletedProcess:
              return subprocess.run(
                  ["git", *args],
                  check=check,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )


          def commit_exists(sha: str | None) -> bool:
              if not sha:
                  return False
              return run_git("cat-file", "-e", f"{sha}^{{commit}}", check=False).returncode == 0


          def ensure_commit(sha: str | None) -> bool:
              if not sha or set(sha) == {"0"}:
                  return False
              if commit_exists(sha):
                  return True
              run_git("fetch", "--no-tags", "--depth=1", "origin", sha, check=False)
              return commit_exists(sha)


          def load_config_at(sha: str, path: str) -> dict | None:
              result = run_git("show", f"{sha}:{path}", check=False)
              if result.returncode != 0:
                  return None
              return json.loads(result.stdout)


          def changed_paths(base_sha: str, head_sha: str) -> list[str]:
              result = run_git("diff", "--name-only", f"{base_sha}..{head_sha}", check=False)
              if result.returncode != 0:
                  raise RuntimeError(result.stderr.strip() or "git diff failed")
              return [line.strip().replace("\\", "/") for line in result.stdout.splitlines() if line.strip()]


          def resolve_changed_libraries(libraries: list[str]) -> tuple[list[str], str]:
              event_name = os.environ.get("GITHUB_EVENT_NAME", "")
              if event_name in {"schedule", "workflow_dispatch"}:
                  return libraries, f"{event_name}: full library scan"

              event_path = os.environ.get("GITHUB_EVENT_PATH")
              event = {}
              if event_path and Path(event_path).exists():
                  event = json.loads(Path(event_path).read_text(encoding="utf-8"))

              head_sha = os.environ.get("GITHUB_SHA", "")
              base_sha = ""
              if event_name == "pull_request":
                  pull_request = event.get("pull_request") or {}
                  base_sha = ((pull_request.get("base") or {}).get("sha") or "").strip()
                  head_sha = ((pull_request.get("head") or {}).get("sha") or head_sha).strip()
              elif event_name == "push":
                  base_sha = str(event.get("before") or "").strip()
                  head_sha = str(event.get("after") or head_sha).strip()

              if not ensure_commit(head_sha):
                  checkout_sha = os.environ.get("GITHUB_SHA", "").strip()
                  if checkout_sha != head_sha and ensure_commit(checkout_sha):
                      head_sha = checkout_sha
              if not ensure_commit(head_sha):
                  return libraries, f"{event_name}: could not resolve head commit; full library scan"
              if not ensure_commit(base_sha):
                  fallback = run_git("rev-parse", f"{head_sha}^", check=False)
                  if fallback.returncode == 0 and ensure_commit(fallback.stdout.strip()):
                      base_sha = fallback.stdout.strip()
                  else:
                      return libraries, f"{event_name}: could not resolve base commit; full library scan"

              try:
                  paths = changed_paths(base_sha, head_sha)
              except RuntimeError as exc:
                  return libraries, f"{event_name}: {exc}; full library scan"

              known = {name.casefold(): name for name in libraries}
              selected: set[str] = set()
              for path in paths:
                  match = re.match(r"^Lib/([^/]+)/", path)
                  if match:
                      name = known.get(match.group(1).casefold())
                      if name:
                          selected.add(name)

              if "config.json" in paths:
                  old_config = load_config_at(base_sha, "config.json")
                  if old_config is None:
                      return libraries, f"{event_name}: config.json changed but base config is unavailable; full library scan"
                  old_libraries = set(old_config["profiles"]["full"]["third_party_libraries"])
                  selected.update(name for name in libraries if name not in old_libraries)
                  old_catalog = {
                      str(entry.get("name", "")).casefold(): entry
                      for entry in old_config.get("third_party_library_catalog", {}).get("libraries", [])
                      if entry.get("name")
                  }
                  new_catalog = {
                      str(entry.get("name", "")).casefold(): entry
                      for entry in config.get("third_party_library_catalog", {}).get("libraries", [])
                      if entry.get("name")
                  }
                  selected.update(
                      name
                      for name in libraries
                      if old_catalog.get(name.casefold()) != new_catalog.get(name.casefold())
                  )

              ordered = [name for name in libraries if name in selected]
              if not ordered:
                  return [], f"{event_name}: no library patch or new full-profile library changed"
              return ordered, f"{event_name}: selected changed libraries: {', '.join(ordered)}"


          config = json.loads(Path("config.json").read_text(encoding="utf-8"))
          libraries = list(config["profiles"]["full"]["third_party_libraries"])
          libraries, reason = resolve_changed_libraries(libraries)
          shard_count = max(1, int(os.environ["LIBRARY_PATCH_SHARD_COUNT"]))
          shards = []
          for index in range(shard_count):
              shard_libraries = libraries[index::shard_count]
              if shard_libraries:
                  shards.append(
                      {
                          "index": index + 1,
                          "count": len(shard_libraries),
                          "libraries": shard_libraries,
                      }
                  )

          print(reason)
          print(f"Resolved {len(libraries)} selected libraries into {len(shards)} shard(s)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("shards=" + json.dumps(shards, separators=(",", ":")) + "\n")
              handle.write(f"has_libraries={'true' if shards else 'false'}\n")
          '@ | python -

  validate:
    name: Validate ${{ matrix.cpython_version }} / shard ${{ matrix.shard.index }}
    runs-on: windows-2022
    timeout-minutes: 360
    if: ${{ needs.resolve-library-shards.outputs.has_libraries == 'true' }}
    needs:
      - resolve-cpython-matrix
      - resolve-library-shards
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        cpython_version: ${{ fromJSON(needs.resolve-cpython-matrix.outputs.versions) }}
        shard: ${{ fromJSON(needs.resolve-library-shards.outputs.shards) }}

    env:
      MATRIX_CPYTHON_VERSION: ${{ matrix.cpython_version }}
      MATRIX_SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_LIBRARIES_JSON: ${{ toJSON(matrix.shard.libraries) }}
      RESULT_JSON: .tmp/library-patch-matrix-${{ matrix.cpython_version }}-shard${{ matrix.shard.index }}.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate downloadable library versions
        shell: pwsh
        run: |
          @'
          import json
          import os
          import re
          import shutil
          import sys
          import time
          import traceback
          from pathlib import Path

          repo_root = Path.cwd()
          if str(repo_root) not in sys.path:
              sys.path.insert(0, str(repo_root))

          import build
          import libs


          def safe_name(value: str) -> str:
              return re.sub(r"[^0-9A-Za-z_.-]+", "-", value).strip("-")


          def remove_path(path: Path) -> None:
              if not path.exists():
                  return
              if path.is_dir():
                  libs._remove_tree(path)
              else:
                  path.unlink()


          def cleanup_integration_paths(source_root: Path, integration) -> None:
              stale_paths = {
                  relative.replace("\\", "/")
                  for relative in [
                      *getattr(integration, "materialized_paths", []),
                      *getattr(integration, "cleanup_paths", []),
                  ]
              }
              for relative in sorted(stale_paths, key=lambda value: (value.count("/"), len(value)), reverse=True):
                  remove_path(source_root / relative)


          def cleanup_integrations(source_root: Path, integrations) -> None:
              for integration in reversed(list(integrations)):
                  cleanup_integration_paths(source_root, integration)


          def compatible_release_versions(integration, target_version) -> tuple[list[str], list[dict]]:
              if integration.source_provider != "pypi":
                  return [integration.release_version or integration.source_provider], []

              project_name = integration.project_name or integration.name
              payload = libs._load_pypi_release_payload(project_name, None)
              releases = payload.get("releases", {})
              project_requires_python = payload.get("info", {}).get("requires_python")
              minimum_release_version = getattr(integration, "minimum_release_version", None)
              versions: list[str] = []
              unbuildable: list[dict] = []
              for raw_version in libs._sorted_release_versions(releases):
                  if minimum_release_version is not None:
                      try:
                          if build.Version(raw_version) < build.Version(minimum_release_version):
                              continue
                      except Exception:
                          pass
                  files = [
                      file_info
                      for file_info in releases.get(raw_version, [])
                      if not file_info.get("yanked") and file_info.get("url")
                  ]
                  applicable = [
                      file_info
                      for file_info in files
                      if libs._supports_target_python(
                          file_info.get("requires_python") or project_requires_python,
                          target_version,
                      )
                  ]
                  if not applicable:
                      continue
                  compatible = libs._compatible_pypi_files(
                      applicable,
                      project_requires_python=project_requires_python,
                      target_version=target_version,
                  )
                  if compatible:
                      versions.append(raw_version)
                  else:
                      unbuildable.append(
                          {
                              "version": raw_version,
                              "reason": "no non-yanked sdist or pure universal wheel; native wheels are not static inputs",
                              "artifacts": [file_info.get("filename") for file_info in applicable],
                          }
                      )
              return versions, unbuildable


          def assert_materialized_paths_exist(source_root: Path, integration) -> None:
              missing = []
              for relative in getattr(integration, "materialized_paths", []):
                  if not (source_root / relative).exists():
                      missing.append(relative)
              if missing:
                  preview = ", ".join(missing[:10])
                  suffix = "" if len(missing) <= 10 else f" (+{len(missing) - 10} more)"
                  raise RuntimeError(f"missing materialized path(s): {preview}{suffix}")


          cpython_version = os.environ["MATRIX_CPYTHON_VERSION"].strip()
          shard_index = int(os.environ["MATRIX_SHARD_INDEX"])
          selected_libraries = json.loads(os.environ["SHARD_LIBRARIES_JSON"])
          result_path = Path(os.environ["RESULT_JSON"])
          work_root = Path(os.environ["RUNNER_TEMP"]) / f"staticpython-library-patch-matrix-{safe_name(cpython_version)}-shard{shard_index}"

          if work_root.exists():
              libs._remove_tree(work_root)
          work_root.mkdir(parents=True, exist_ok=True)

          build.DOWNLOAD_ROOT = work_root / "downloads"
          build.WORK_CACHE_ROOT = work_root / "vendor-stage"
          build.DOWNLOAD_ROOT.mkdir(parents=True, exist_ok=True)
          build.WORK_CACHE_ROOT.mkdir(parents=True, exist_ok=True)

          summary = {
              "cpython_version": cpython_version,
              "shard_index": shard_index,
              "library_count": len(selected_libraries),
              "libraries": [],
              "failure_count": 0,
              "job_failures": [],
          }

          def write_summary() -> None:
              result_path.parent.mkdir(parents=True, exist_ok=True)
              result_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")


          def cpython_archive_urls(version: str) -> list[str]:
              return [
                  f"https://github.com/python/cpython/archive/refs/tags/v{version}.zip",
                  f"https://codeload.github.com/python/cpython/zip/refs/tags/v{version}",
              ]


          def download_cpython_source_with_retries(version: str, root: Path) -> Path:
              root.mkdir(parents=True, exist_ok=True)
              archive_path = root / f"cpython-v{version}.zip"
              existing = sorted(root.glob(f"cpython-{version}*"))
              for candidate in existing:
                  if (candidate / "Include" / "patchlevel.h").exists():
                      print(f"[library-patch-matrix] reusing existing CPython source tree at {candidate}")
                      return candidate

              attempts = 5
              for attempt in range(1, attempts + 1):
                  try:
                      used_url = build.download_first_available(cpython_archive_urls(version), archive_path)
                      source_root = build.extract_zip_archive(archive_path, root, reuse_existing=True)
                      print(f"[library-patch-matrix] downloaded CPython {version} from {used_url} to {source_root}")
                      return source_root
                  except Exception as exc:
                      if attempt == attempts:
                          raise
                      wait_seconds = min(90, attempt * 15)
                      print(
                          f"[library-patch-matrix] CPython {version} download failed "
                          f"on attempt {attempt}/{attempts}: {type(exc).__name__}: {exc}; "
                          f"retrying in {wait_seconds}s"
                      )
                      time.sleep(wait_seconds)
              raise RuntimeError(f"failed to download CPython {version}")

          try:
              manifest = build.load_manifest()
              config = build.load_config()
              _profile_name, profile = build.resolve_profile(config, "full")
              third_party_catalog = build.profile_library_catalog(config, profile, "third_party_library_catalog")

              cpython_download_root = work_root / "cpython"
              base_source_root = download_cpython_source_with_retries(cpython_version, cpython_download_root)
              version_info, version_mm, version_full = build.parse_cpython_version(base_source_root)
              target_version = build.Version(version_full)
              integrations = libs.load_integrations(
                  build.LIB_PATCH_ROOT,
                  selected_libraries,
                  target_version=target_version,
                  library_catalog=third_party_catalog,
              )
              by_name = {integration.name.casefold(): integration for integration in integrations}

              for library_name in selected_libraries:
                  library_summary = {
                      "name": str(library_name),
                      "project_name": None,
                      "source_provider": None,
                      "compatible_versions": 0,
                      "unbuildable_versions": [],
                      "passed_versions": [],
                      "failed_versions": [],
                      "library_failures": [],
                  }
                  summary["libraries"].append(library_summary)
                  write_summary()
                  source_root = None
                  try:
                      requested_name = str(library_name)
                      integration = by_name.get(requested_name.casefold())
                      if integration is None:
                          raise RuntimeError(f"failed to resolve integration {library_name!r} for CPython {version_full}")

                      library_summary["name"] = integration.name
                      library_summary["project_name"] = integration.project_name
                      library_summary["source_provider"] = integration.source_provider

                      release_versions, unbuildable_versions = compatible_release_versions(integration, target_version)
                      library_summary["compatible_versions"] = len(release_versions)
                      library_summary["unbuildable_versions"] = unbuildable_versions
                      write_summary()

                      if not release_versions:
                          print(f"[library-patch-matrix] {integration.name}: no compatible downloadable versions for CPython {version_full}")
                          continue

                      selected_integrations = libs.load_integrations(
                          build.LIB_PATCH_ROOT,
                          [requested_name],
                          target_version=target_version,
                          library_catalog=third_party_catalog,
                      )
                      selected_by_name = {item.name.casefold(): item for item in selected_integrations}
                      integration = selected_by_name.get(requested_name.casefold()) or selected_by_name.get(integration.name.casefold())
                      if integration is None:
                          raise RuntimeError(f"failed to resolve selected integration {library_name!r} for CPython {version_full}")

                      source_root = work_root / "sources" / safe_name(integration.name)
                      if source_root.exists():
                          libs._remove_tree(source_root)
                      shutil.copytree(base_source_root, source_root)
                      hook_context = build.make_library_hook_context(
                          source_root,
                          version_info,
                          version_mm,
                          version_full,
                          "Release",
                          "x64",
                      )

                      print(
                          f"[library-patch-matrix] {integration.name}: validating {len(release_versions)} version(s) "
                          f"for CPython {version_full}"
                      )

                      for index, raw_version in enumerate(release_versions, start=1):
                          try:
                              for item in selected_integrations:
                                  if (
                                      item.source_provider == "pypi"
                                      and item.name.casefold() == integration.name.casefold()
                                  ):
                                      item.release_version = raw_version
                              cleanup_integrations(source_root, selected_integrations)
                              libs.run_prepare_source_hooks(selected_integrations, hook_context)
                              build.copy_overlay_entries(
                                  source_root,
                                  build.ASSET_ROOT,
                                  {"overlay_entries": []},
                                  selected_integrations,
                                  version_info,
                              )
                              libs.run_pre_patch_hooks(selected_integrations, hook_context)
                              libs.run_post_patch_hooks(selected_integrations, hook_context)
                              assert_materialized_paths_exist(source_root, integration)
                              library_summary["passed_versions"].append(raw_version)
                              if index % 25 == 0 or index == len(release_versions):
                                  print(
                                      f"[library-patch-matrix] {integration.name}: "
                                      f"{index}/{len(release_versions)} version(s) checked"
                                  )
                          except Exception as exc:
                              failure = {
                                  "version": raw_version,
                                  "error": f"{type(exc).__name__}: {exc}",
                                  "traceback": traceback.format_exc(),
                              }
                              library_summary["failed_versions"].append(failure)
                              summary["failure_count"] += 1
                              print(
                                  f"[library-patch-matrix] {integration.name} {raw_version} failed: "
                                  f"{type(exc).__name__}: {exc}"
                              )
                          write_summary()
                  except Exception as exc:
                      failure = {
                          "error": f"{type(exc).__name__}: {exc}",
                          "traceback": traceback.format_exc(),
                      }
                      library_summary["library_failures"].append(failure)
                      summary["failure_count"] += 1
                      print(
                          f"[library-patch-matrix] {library_summary['name']} library-level failure: "
                          f"{type(exc).__name__}: {exc}"
                      )
                  finally:
                      if source_root is not None and source_root.exists():
                          libs._remove_tree(source_root)
                      write_summary()
          except Exception as exc:
              summary["job_failures"].append(
                  {
                      "error": f"{type(exc).__name__}: {exc}",
                      "traceback": traceback.format_exc(),
                  }
              )
              summary["failure_count"] += 1
              print(f"[library-patch-matrix] job-level failure: {type(exc).__name__}: {exc}")
          finally:
              write_summary()

          total_versions = sum(library["compatible_versions"] for library in summary["libraries"])
          passed_versions = sum(len(library["passed_versions"]) for library in summary["libraries"])
          failed_versions = sum(len(library["failed_versions"]) for library in summary["libraries"])
          unbuildable_versions = sum(len(library["unbuildable_versions"]) for library in summary["libraries"])
          library_failures = sum(len(library["library_failures"]) for library in summary["libraries"])
          job_failures = len(summary["job_failures"])
          print(
              f"[library-patch-matrix] shard {shard_index} / CPython {cpython_version}: "
              f"{passed_versions} passed, {failed_versions} version failures, "
              f"{unbuildable_versions} evidence-backed unbuildable versions, "
              f"{library_failures} library failures, {job_failures} job failures, "
              f"{total_versions} total compatible version(s)"
          )

          if summary["failure_count"]:
              failed_preview = []
              for library in summary["libraries"]:
                  for failure in library["failed_versions"][:5]:
                      failed_preview.append(f"{library['name']} {failure['version']}: {failure['error']}")
                  for failure in library["library_failures"][:5]:
                      failed_preview.append(f"{library['name']} <library>: {failure['error']}")
                  if len(failed_preview) >= 20:
                      break
              for failure in summary["job_failures"][:5]:
                  failed_preview.append(f"<job>: {failure['error']}")
              if failed_preview:
                  print("[library-patch-matrix] first failures:")
                  for line in failed_preview[:20]:
                      print(f"  - {line}")
              raise SystemExit(1)
          '@ | python -

      - name: Publish shard summary
        if: always()
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RESULT_JSON"])
          if not result_path.exists():
              print(f"summary file not found: {result_path}")
              raise SystemExit(0)

          summary = json.loads(result_path.read_text(encoding="utf-8"))
          total_versions = sum(library["compatible_versions"] for library in summary["libraries"])
          passed_versions = sum(len(library["passed_versions"]) for library in summary["libraries"])
          failed_versions = sum(len(library["failed_versions"]) for library in summary["libraries"])
          unbuildable_versions = sum(len(library.get("unbuildable_versions", [])) for library in summary["libraries"])
          library_failures = sum(len(library["library_failures"]) for library in summary["libraries"])
          job_failures = len(summary["job_failures"])

          lines = [
              f"### CPython {summary['cpython_version']} / shard {summary['shard_index']}",
              "",
              f"- Libraries in shard: {summary['library_count']}",
              f"- Compatible downloadable versions checked: {total_versions}",
              f"- Passed versions: {passed_versions}",
              f"- Failed versions: {failed_versions}",
              f"- Evidence-backed unbuildable versions: {unbuildable_versions}",
              f"- Library-level failures: {library_failures}",
              f"- Job-level failures: {job_failures}",
          ]
          if failed_versions or library_failures:
              lines.append("- Failed libraries:")
              for library in summary["libraries"]:
                  if library["failed_versions"] or library["library_failures"]:
                      lines.append(
                          f"  - {library['name']}: "
                          f"{len(library['failed_versions'])} version failure(s), "
                          f"{len(library['library_failures'])} library failure(s)"
                      )
          if job_failures:
              lines.append(f"- Job-level failures captured: {job_failures}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          '@ | python -

      - name: Upload shard summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-patch-matrix-${{ matrix.cpython_version }}-shard${{ matrix.shard.index }}
          path: ${{ env.RESULT_JSON }}
          if-no-files-found: warn
