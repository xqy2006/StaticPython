name: Daily library version contract

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/library-version-discovery.yml"
      - "Lib/**"
      - "scripts/*contract*.py"
      - "scripts/*library*history*.py"
      - "scripts/verify_pack_with_runtime_sdk.py"
      - "scripts/test_verify_pack_with_runtime_sdk.py"
      - "pack_evidence.py"
      - "build.py"
      - "config.json"
      - "libs.py"
      - "manifest.json"
      - "verify.py"
  pull_request:
    paths:
      - ".github/workflows/library-version-discovery.yml"
      - "Lib/**"
      - "scripts/*contract*.py"
      - "scripts/*library*history*.py"
      - "scripts/verify_pack_with_runtime_sdk.py"
      - "scripts/test_verify_pack_with_runtime_sdk.py"
      - "pack_evidence.py"
      - "build.py"
      - "config.json"
      - "libs.py"
      - "manifest.json"
      - "verify.py"
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: staticpython-library-contract-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  STATICPYTHON_CONTRACT_BUILD_WORKERS: "2"

jobs:
  discover:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_candidates: ${{ steps.matrix.outputs.has_candidates }}
      runtime_versions: ${{ steps.matrix.outputs.runtime_versions }}
      contract_sha256: ${{ steps.matrix.outputs.contract_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install discovery dependencies
        run: python -m pip install packaging

      - name: Run contract unit tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python .\scripts\test_library_version_contract.py
          python .\scripts\test_promote_library_contract.py
          python .\scripts\test_build_library_contract_config.py
          python .\scripts\test_library_contract_build.py
          python .\scripts\test_prepare_library_contract_matrix.py
          python .\scripts\test_prepare_library_history_batches.py
          python .\scripts\test_verify_pack_with_runtime_sdk.py

      - name: Resolve latest CPython 3.11 through 3.15 tags
        id: resolve
        shell: pwsh
        run: |
          $tags = @(git ls-remote --tags --refs https://github.com/python/cpython.git "v3.*" |
            ForEach-Object {
              if ($_ -match "refs/tags/v((3)\.(11|12|13|14|15)\.([0-9]+)(?:(a|b|rc)([0-9]+))?)$") {
                $phaseRank = switch ($matches[5]) { "a" { 1 } "b" { 2 } "rc" { 3 } default { 4 } }
                [PSCustomObject]@{
                  Version = $matches[1]
                  Series = "3.$($matches[3])"
                  Major = [int]$matches[2]
                  Minor = [int]$matches[3]
                  Micro = [int]$matches[4]
                  PhaseRank = $phaseRank
                  PhaseSerial = if ($matches[6]) { [int]$matches[6] } else { 0 }
                }
              }
            })
          if (-not $tags) { throw "Could not resolve CPython tags" }
          $versions = foreach ($series in @("3.11", "3.12", "3.13", "3.14", "3.15")) {
            $latest = $tags | Where-Object Series -eq $series |
              Sort-Object Major, Minor, Micro, PhaseRank, PhaseSerial | Select-Object -Last 1
            if (-not $latest) { throw "Could not resolve CPython $series" }
            $latest.Version
          }
          "versions=$(ConvertTo-Json -InputObject @($versions) -Compress)" >> $env:GITHUB_OUTPUT

      - name: Download last-known-good master catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $baselineDir = Join-Path $env:GITHUB_WORKSPACE ".tmp\baseline"
          $contractDir = Join-Path $env:GITHUB_WORKSPACE ".tmp\contract"
          New-Item -ItemType Directory -Force $baselineDir | Out-Null
          New-Item -ItemType Directory -Force $contractDir | Out-Null
          $apiPath = "repos/${{ github.repository }}/actions/workflows/library-version-discovery.yml/runs?branch=master&per_page=100"
          $oldPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $responseText = gh api $apiPath 2>$null
          $apiExitCode = $LASTEXITCODE
          $ErrorActionPreference = $oldPreference
          if ($apiExitCode -ne 0) {
            Write-Host "No master catalog run is readable; this run will establish a discovery baseline."
            exit 0
          }
          $runs = @(($responseText | ConvertFrom-Json).workflow_runs) |
            Where-Object {
              $_.status -eq "completed" -and
              [string]$_.id -ne "${{ github.run_id }}"
            } |
            Sort-Object created_at -Descending
          if ($runs.Count -eq 0) {
            Write-Host "No completed master catalog run exists yet; this run will establish a discovery baseline."
            exit 0
          }

          foreach ($priorRun in $runs) {
            $artifactResponse = gh api "repos/${{ github.repository }}/actions/runs/$($priorRun.id)/artifacts?per_page=100" | ConvertFrom-Json
            $artifact = @($artifactResponse.artifacts) |
              Where-Object { $_.name -eq "library-contract-catalog" -and -not $_.expired } |
              Select-Object -First 1
            if (-not $artifact) { continue }

            $catalogDir = Join-Path $baselineDir "catalog"
            if (Test-Path -LiteralPath $catalogDir) { Remove-Item -LiteralPath $catalogDir -Recurse -Force }
            New-Item -ItemType Directory -Force $catalogDir | Out-Null
            gh run download $priorRun.id `
              --repo "${{ github.repository }}" `
              --name "library-contract-catalog" `
              --dir $catalogDir
            if ($LASTEXITCODE -ne 0) { throw "Could not download catalog from run $($priorRun.id)" }
            $indexPath = Join-Path $catalogDir "index.v1.json"
            if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) {
              throw "Catalog from run $($priorRun.id) has no index.v1.json"
            }
            $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
            if (-not $index.active -or [string]::IsNullOrWhiteSpace([string]$index.active.contract)) {
              Write-Host "Catalog from run $($priorRun.id) has no active contract; checking an older run."
              continue
            }
            $catalogRoot = [System.IO.Path]::GetFullPath($catalogDir).TrimEnd('\', '/') + [System.IO.Path]::DirectorySeparatorChar
            $activeContract = [System.IO.Path]::GetFullPath(
              (Join-Path $catalogDir ([string]$index.active.contract))
            )
            if (-not $activeContract.StartsWith($catalogRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Catalog from run $($priorRun.id) has an active contract outside its root"
            }
            if (-not (Test-Path -LiteralPath $activeContract -PathType Leaf)) {
              throw "Catalog from run $($priorRun.id) is missing active contract $($index.active.contract)"
            }
            Copy-Item -LiteralPath $activeContract -Destination (Join-Path $baselineDir "library-version-contract.json") -Force
            Copy-Item -LiteralPath $catalogDir -Destination (Join-Path $contractDir "previous-catalog") -Recurse -Force
            Write-Host "Using active last-known-good catalog from completed master run $($priorRun.id)"
            exit 0
          }

          foreach ($priorRun in @($runs | Where-Object { $_.conclusion -eq "success" })) {
            $artifactResponse = gh api "repos/${{ github.repository }}/actions/runs/$($priorRun.id)/artifacts?per_page=100" | ConvertFrom-Json
            $artifact = @($artifactResponse.artifacts) |
              Where-Object { $_.name -eq "library-version-contract" -and -not $_.expired } |
              Select-Object -First 1
            if (-not $artifact) { continue }

            $legacyDir = Join-Path $baselineDir "legacy"
            if (Test-Path -LiteralPath $legacyDir) { Remove-Item -LiteralPath $legacyDir -Recurse -Force }
            New-Item -ItemType Directory -Force $legacyDir | Out-Null
            gh run download $priorRun.id `
              --repo "${{ github.repository }}" `
              --name "library-version-contract" `
              --dir $legacyDir
            if ($LASTEXITCODE -ne 0) { throw "Could not download legacy baseline from run $($priorRun.id)" }
            $legacyContract = Join-Path $legacyDir "library-version-contract.json"
            if (-not (Test-Path -LiteralPath $legacyContract -PathType Leaf)) {
              throw "Legacy artifact from run $($priorRun.id) has no library-version-contract.json"
            }
            Copy-Item -LiteralPath $legacyContract -Destination (Join-Path $baselineDir "library-version-contract.json") -Force
            Copy-Item -LiteralPath $legacyContract -Destination (Join-Path $contractDir "previous-legacy-contract.json") -Force
            Write-Host "Using legacy discovery baseline from successful master run $($priorRun.id); it is not marked as historically verified."
            exit 0
          }

          Write-Host "No live master catalog or legacy baseline exists; this run will establish a discovery baseline."

      - name: Discover stable non-yanked PyPI versions
        shell: pwsh
        env:
          CPYTHON_VERSIONS_JSON: ${{ steps.resolve.outputs.versions }}
        run: |
          $contractDir = Join-Path $env:GITHUB_WORKSPACE ".tmp\contract"
          $contractPath = Join-Path $contractDir "library-version-contract.json"
          $deltaPath = Join-Path $contractDir "library-version-delta.json"
          $baselinePath = Join-Path $env:GITHUB_WORKSPACE ".tmp\baseline\library-version-contract.json"
          New-Item -ItemType Directory -Force $contractDir | Out-Null
          $contractArgs = @(
            ".\scripts\library_version_contract.py",
            "--output", $contractPath,
            "--delta-output", $deltaPath
          )
          @($env:CPYTHON_VERSIONS_JSON | ConvertFrom-Json) | ForEach-Object {
            $contractArgs += @("--python-version", $_)
          }
          if (Test-Path -LiteralPath $baselinePath -PathType Leaf) {
            $contractArgs += @("--previous", $baselinePath)
          }
          python @contractArgs

      - name: Validate delta and prepare incremental build matrix
        id: matrix
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $contractDir = Join-Path $env:GITHUB_WORKSPACE ".tmp\contract"
          $contractPath = Join-Path $contractDir "library-version-contract.json"
          $deltaPath = Join-Path $contractDir "library-version-delta.json"
          $matrixPath = Join-Path $contractDir "library-version-matrix.json"
          $summaryPath = Join-Path $contractDir "library-version-summary.md"
          $matrixArgs = @(
            ".\scripts\prepare_library_contract_matrix.py",
            "--contract", $contractPath,
            "--delta", $deltaPath,
            "--matrix-output", $matrixPath,
            "--summary-output", $summaryPath,
            "--defer-overflow-to-history"
          )
          if ("${{ github.event_name }}" -eq "pull_request") {
            $matrixArgs += @(
              "--smoke-library", "six",
              "--smoke-python-series", "3.13"
            )
          }
          python @matrixArgs
          $matrixDocument = Get-Content -LiteralPath $matrixPath -Raw | ConvertFrom-Json
          $dispatchMatrix = [ordered]@{
            include = @($matrixDocument.batches | ForEach-Object {
              [ordered]@{
                slug = $_.slug
                candidate_count = $_.candidate_count
              }
            })
          }
          $candidateRecords = @(
            foreach ($batch in @($matrixDocument.batches)) {
              @($batch.candidates_json | ConvertFrom-Json)
            }
          )
          $runtimeVersions = @(
            $candidateRecords |
              ForEach-Object { [string]$_.python_version } |
              Sort-Object -Unique
          )
          $matrix = ConvertTo-Json -InputObject $dispatchMatrix -Depth 4 -Compress
          $includeCount = @($dispatchMatrix.include).Count
          $hasCandidates = ($includeCount -gt 0).ToString().ToLowerInvariant()
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          "has_candidates=$hasCandidates" >> $env:GITHUB_OUTPUT
          "runtime_versions=$(ConvertTo-Json -InputObject @($runtimeVersions) -Compress)" >> $env:GITHUB_OUTPUT
          "contract_sha256=$($contract.contract_sha256)" >> $env:GITHUB_OUTPUT
          Get-Content -LiteralPath $summaryPath | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload immutable contract and delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-version-contract
          path: .tmp/contract/*
          if-no-files-found: warn
          retention-days: 90

  build-contract-runtime-sdks:
    needs: discover
    if: ${{ needs.discover.outputs.has_candidates == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python_version: ${{ fromJSON(needs.discover.outputs.runtime_versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime SDK build dependencies
        shell: pwsh
        run: |
          python -m pip install packaging
          choco install strawberryperl -y --no-progress

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build audited contract runtime SDK
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist\contract-runtime\${{ matrix.python_version }}"
          New-Item -ItemType Directory -Force $dist | Out-Null
          python .\build.py `
            --cpython-version "${{ matrix.python_version }}" `
            --download-root "$env:RUNNER_TEMP\contract-runtime-${{ matrix.python_version }}" `
            --profile runtime-sdk `
            --build-workers $env:STATICPYTHON_CONTRACT_BUILD_WORKERS `
            --output-runtime-sdk-dir $dist

      - name: Upload immutable contract runtime SDK
        uses: actions/upload-artifact@v4
        with:
          name: contract-runtime-sdk-${{ matrix.python_version }}
          path: dist/contract-runtime/${{ matrix.python_version }}/*.zip
          if-no-files-found: error
          retention-days: 14

  validate-new-candidates:
    needs: [discover, build-contract-runtime-sdks]
    if: ${{ needs.discover.outputs.has_candidates == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix).include }}
    env:
      CONTRACT_BATCH_SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Download immutable contract matrix
        uses: actions/download-artifact@v4
        with:
          name: library-version-contract
          path: .tmp/contract

      - name: Load exact candidate batch
        shell: pwsh
        run: |
          $matrixPath = Join-Path $env:GITHUB_WORKSPACE ".tmp\contract\library-version-matrix.json"
          if (-not (Test-Path -LiteralPath $matrixPath -PathType Leaf)) {
            throw "Downloaded contract artifact has no library-version-matrix.json"
          }
          $matrix = Get-Content -LiteralPath $matrixPath -Raw | ConvertFrom-Json
          $matches = @($matrix.batches | Where-Object slug -eq $env:CONTRACT_BATCH_SLUG)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one contract batch named $env:CONTRACT_BATCH_SLUG"
          }
          $batch = $matches[0]
          $candidates = @($batch.candidates_json | ConvertFrom-Json)
          if (
            $candidates.Count -lt 1 -or
            $candidates.Count -gt 2 -or
            $candidates.Count -ne [int]$batch.candidate_count
          ) {
            throw "Contract batch candidate count does not match its manifest"
          }
          "CONTRACT_BATCH_JSON=$($batch.candidates_json)" >> $env:GITHUB_ENV

      - name: Define isolated contract paths
        shell: pwsh
        run: |
          "CONTRACT_BATCH_BUILD_ROOT=$(Join-Path $env:RUNNER_TEMP 'library-contract-build-${{ matrix.slug }}')" >> $env:GITHUB_ENV
          "CONTRACT_BATCH_RESULT_ROOT=$(Join-Path $env:RUNNER_TEMP 'library-contract-result-${{ matrix.slug }}')" >> $env:GITHUB_ENV
          "CONTRACT_SOURCE_CACHE=$(Join-Path $env:GITHUB_WORKSPACE 'downloads')" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact contract runtime SDKs
        uses: actions/download-artifact@v4
        with:
          pattern: contract-runtime-sdk-*
          path: ${{ runner.temp }}/contract-runtime-sdks
          merge-multiple: false

      - name: Install build dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install packaging
          choco install strawberryperl -y --no-progress

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build and verify candidate batch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $candidates = @($env:CONTRACT_BATCH_JSON | ConvertFrom-Json)
          $failures = [System.Collections.Generic.List[string]]::new()
          $batchBuildRootPath = [IO.Path]::GetFullPath($env:CONTRACT_BATCH_BUILD_ROOT)
          $runtimeSdkRoot = Join-Path $env:RUNNER_TEMP "contract-runtime-sdks"
          $candidateOrdinal = 0
          foreach ($candidate in $candidates) {
            $candidateOrdinal += 1
            $candidateDirectory = "candidate-{0:D3}" -f $candidateOrdinal
            $buildRoot = Join-Path $env:CONTRACT_BATCH_BUILD_ROOT $candidateDirectory
            $resultRoot = Join-Path $env:CONTRACT_BATCH_RESULT_ROOT $candidateDirectory
            $identity = "$($candidate.library) $($candidate.version) / CPython $($candidate.python_version)"
            $buildRootPath = $null
            $safeBuildRoot = $false
            $reportPath = Join-Path `
              $buildRoot `
              "cpython-$($candidate.python_version)\PCbuild\staticpython-pack-verify-report.json"
            try {
              $buildRootPath = [IO.Path]::GetFullPath($buildRoot)
              $relativeBuildRoot = [IO.Path]::GetRelativePath(
                $batchBuildRootPath,
                $buildRootPath
              )
              if (
                $relativeBuildRoot -eq "." -or
                $relativeBuildRoot -eq ".." -or
                $relativeBuildRoot.StartsWith("..\") -or
                $relativeBuildRoot.StartsWith("../") -or
                [IO.Path]::IsPathRooted($relativeBuildRoot)
              ) {
                throw "Candidate build root escapes the isolated batch directory"
              }
              $safeBuildRoot = $true
              New-Item -ItemType Directory -Force $resultRoot | Out-Null
              python .\scripts\build_library_contract_config.py `
                --library $candidate.library `
                --version $candidate.version `
                --output-config (Join-Path $resultRoot "config.json")
              python .\scripts\library_contract_build.py stage `
                --download-root $env:CONTRACT_SOURCE_CACHE `
                --project-name $candidate.project_name `
                --version $candidate.version `
                --filename $candidate.source_filename `
                --url $candidate.source_url `
                --sha256 $candidate.source_sha256
              $packDir = Join-Path $resultRoot "packs"
              $runtimeSdkDirectory = Join-Path `
                $runtimeSdkRoot `
                "contract-runtime-sdk-$($candidate.python_version)"
              $runtimeSdk = @(
                Get-ChildItem -LiteralPath $runtimeSdkDirectory -Filter *.zip -File
              )
              if ($runtimeSdk.Count -ne 1) {
                throw "$identity expected exactly one contract runtime SDK, found $($runtimeSdk.Count)"
              }
              New-Item -ItemType Directory -Force $packDir | Out-Null
              python .\build.py `
                --cpython-version $candidate.python_version `
                --download-root $buildRoot `
                --config (Join-Path $resultRoot "config.json") `
                --profile library-contract `
                --pack-only `
                --pack-runtime-sdk $runtimeSdk[0].FullName `
                --build-workers $env:STATICPYTHON_CONTRACT_BUILD_WORKERS `
                --output-pack-dir $packDir `
                --output-pack-name $candidate.library
              $pack = @(Get-ChildItem -LiteralPath $packDir -Filter *.zip -File)
              if ($pack.Count -ne 1) {
                throw "$identity expected exactly one final contract pack, found $($pack.Count)"
              }
              python .\pack_evidence.py --report $reportPath --pack $pack[0].FullName
              $sdkReport = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
              $verificationExe = [string]$sdkReport.executable
              if (-not (Test-Path -LiteralPath $verificationExe -PathType Leaf)) {
                throw "SDK-linked verification executable is missing: $verificationExe"
              }
              python .\scripts\library_contract_build.py verify `
                --download-root $env:CONTRACT_SOURCE_CACHE `
                --project-name $candidate.project_name `
                --library $candidate.library `
                --version $candidate.version `
                --python-version $candidate.python_version `
                --filename $candidate.source_filename `
                --sha256 $candidate.source_sha256 `
                --pack-dir $packDir `
                --python-exe $verificationExe `
                --report (Join-Path $resultRoot "library-contract-build-report.json")
              if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
                throw "StaticPython verification report is missing"
              }
              Copy-Item `
                -LiteralPath $reportPath `
                -Destination (Join-Path $resultRoot "staticpython-pack-verify-report.json") `
                -Force
            }
            catch {
              New-Item -ItemType Directory -Force $resultRoot | Out-Null
              $message = "$identity failed: $($_.Exception.Message)"
              $failures.Add($message)
              Set-Content `
                -LiteralPath (Join-Path $resultRoot "library-contract-batch-failure.txt") `
                -Value $message `
                -Encoding utf8
              Write-Warning $message
            }
            finally {
              if ($safeBuildRoot -and (Test-Path -LiteralPath $buildRootPath -PathType Container)) {
                try {
                  $savedVerifyReport = Join-Path $resultRoot "staticpython-pack-verify-report.json"
                  if (
                    (Test-Path -LiteralPath $reportPath -PathType Leaf) -and
                    -not (Test-Path -LiteralPath $savedVerifyReport -PathType Leaf)
                  ) {
                    Copy-Item `
                      -LiteralPath $reportPath `
                      -Destination $savedVerifyReport `
                      -Force
                  }
                  Remove-Item -LiteralPath $buildRootPath -Recurse -Force
                }
                catch {
                  New-Item -ItemType Directory -Force $resultRoot | Out-Null
                  $message = "$identity cleanup failed: $($_.Exception.Message)"
                  $failures.Add($message)
                  Add-Content `
                    -LiteralPath (Join-Path $resultRoot "library-contract-batch-failure.txt") `
                    -Value $message `
                    -Encoding utf8
                  Write-Warning $message
                }
              }
            }
          }
          if ($failures.Count -gt 0) {
            throw ("$($failures.Count) candidate batch operation(s) failed:`n" + ($failures -join "`n"))
          }

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-contract-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/library-contract-result-${{ matrix.slug }}/**/*
          if-no-files-found: warn
          retention-days: 30

  promote-contract-catalog:
    needs: [discover, validate-new-candidates]
    if: ${{ always() && needs.discover.result != 'cancelled' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install promotion dependencies
        run: python -m pip install packaging

      - name: Download candidate contract
        uses: actions/download-artifact@v4
        with:
          name: library-version-contract
          path: .tmp/promotion-input

      - name: Download candidate validation evidence
        if: ${{ needs.validate-new-candidates.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: library-contract-*
          path: .tmp/validation

      - name: Download matching full-history validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $candidatePath = Join-Path $env:GITHUB_WORKSPACE ".tmp\promotion-input\library-version-contract.json"
          $matrixPath = Join-Path $env:GITHUB_WORKSPACE ".tmp\promotion-input\library-version-matrix.json"
          if (-not (Test-Path -LiteralPath $matrixPath -PathType Leaf)) {
            Write-Host "Candidate has no validation matrix; no history adoption is possible."
            exit 0
          }
          $matrix = Get-Content -LiteralPath $matrixPath -Raw | ConvertFrom-Json
          if ($null -eq $matrix.deferred) {
            Write-Host "Candidate delta is not deferred; skipping weekly history catalog lookup."
            exit 0
          }
          $candidateHash = [string](Get-Content -LiteralPath $candidatePath -Raw | ConvertFrom-Json).contract_sha256
          $apiPath = "repos/${{ github.repository }}/actions/workflows/library-history-weekly.yml/runs?branch=master&status=completed&per_page=100"
          $oldPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $responseText = gh api $apiPath 2>$null
          $apiExitCode = $LASTEXITCODE
          $ErrorActionPreference = $oldPreference
          if ($apiExitCode -ne 0 -or -not $responseText) {
            Write-Host "No weekly history catalog is readable; oversized deltas will remain deferred."
            exit 0
          }
          $runs = @(($responseText | ConvertFrom-Json).workflow_runs) |
            Where-Object { $_.conclusion -eq "success" } |
            Sort-Object id -Descending |
            Select-Object -First 10
          $lookupRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp\history-support-lookup"
          foreach ($priorRun in $runs) {
            $artifacts = @((gh api "repos/${{ github.repository }}/actions/runs/$($priorRun.id)/artifacts?name=library-history-support-catalog&per_page=100" | ConvertFrom-Json).artifacts)
            $artifact = $artifacts |
              Where-Object { $_.name -eq "library-history-support-catalog" -and -not $_.expired } |
              Select-Object -First 1
            if (-not $artifact) { continue }
            $downloadRoot = Join-Path $lookupRoot "catalog-$($priorRun.id)"
            New-Item -ItemType Directory -Force $downloadRoot | Out-Null
            gh run download $priorRun.id `
              --repo "${{ github.repository }}" `
              --name "library-history-support-catalog" `
              --dir $downloadRoot
            if ($LASTEXITCODE -ne 0) { continue }
            $indexPath = Join-Path $downloadRoot "index.v1.json"
            if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) { continue }
            $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
            if ([string]$index.active.contract_sha256 -ne $candidateHash) { continue }
            $destination = Join-Path $env:GITHUB_WORKSPACE ".tmp\history-support-catalog"
            New-Item -ItemType Directory -Force $destination | Out-Null
            Copy-Item -Path (Join-Path $downloadRoot "*") -Destination $destination -Recurse -Force
            Write-Host "Using exact full-history validation from run $($priorRun.id) for contract $candidateHash"
            break
          }

      - name: Evaluate promotion and materialize catalog
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $inputRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp\promotion-input"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp\library-contract-catalog"
          $candidatePath = Join-Path $inputRoot "library-version-contract.json"
          $deltaPath = Join-Path $inputRoot "library-version-delta.json"
          $matrixPath = Join-Path $inputRoot "library-version-matrix.json"
          $previousCatalog = Join-Path $inputRoot "previous-catalog"
          $legacyBaseline = Join-Path $inputRoot "previous-legacy-contract.json"
          $validationRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp\validation"
          $historySupportCatalog = Join-Path $env:GITHUB_WORKSPACE ".tmp\history-support-catalog"
          $mode = if (
            "${{ github.event_name }}" -eq "pull_request" -or
            "${{ github.ref_name }}" -ne "master"
          ) { "preview" } else { "promote" }

          $promotionArgs = @(
            ".\scripts\promote_library_contract.py",
            "--candidate-contract", $candidatePath,
            "--delta", $deltaPath,
            "--mode", $mode,
            "--output", $outputRoot,
            "--repository", "${{ github.repository }}",
            "--run-id", "${{ github.run_id }}",
            "--run-attempt", "${{ github.run_attempt }}",
            "--run-url", "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "--source-commit", "${{ github.sha }}",
            "--source-ref", "${{ github.ref }}",
            "--event-name", "${{ github.event_name }}"
          )
          if (Test-Path -LiteralPath $matrixPath -PathType Leaf) {
            $promotionArgs += @("--matrix", $matrixPath)
          }
          if (Test-Path -LiteralPath $validationRoot -PathType Container) {
            $promotionArgs += @("--validation-root", $validationRoot)
          }
          if (Test-Path -LiteralPath (Join-Path $historySupportCatalog "index.v1.json") -PathType Leaf) {
            $promotionArgs += @("--history-support-catalog", $historySupportCatalog)
          }
          if (Test-Path -LiteralPath (Join-Path $previousCatalog "index.v1.json") -PathType Leaf) {
            $promotionArgs += @("--previous-catalog", $previousCatalog)
          }
          elseif (Test-Path -LiteralPath $legacyBaseline -PathType Leaf) {
            $promotionArgs += @("--legacy-baseline-contract", $legacyBaseline)
          }
          python @promotionArgs

      - name: Add promotion decision to summary
        if: always()
        shell: pwsh
        run: |
          $summary = ".tmp\library-contract-catalog\promotion-summary.md"
          if (Test-Path -LiteralPath $summary -PathType Leaf) {
            Get-Content -LiteralPath $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload candidate and last-known-good catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-contract-catalog
          path: .tmp/library-contract-catalog/**
          if-no-files-found: error
          retention-days: 90

      - name: Enforce promotion gate
        if: always()
        shell: pwsh
        run: |
          $indexPath = ".tmp\library-contract-catalog\index.v1.json"
          if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) {
            throw "Promotion did not produce index.v1.json"
          }
          $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
          if ($index.decision.gate -ne "passed") {
            $codes = @($index.decision.blockers | ForEach-Object { $_.code }) -join ", "
            throw "Library contract promotion is frozen: $codes"
          }
